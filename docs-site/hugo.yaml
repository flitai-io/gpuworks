title: &siteTitle GPUWorks 文档
baseURL: https://gpuworks.zstack.ai/docs/
defaultContentLanguage: zh
disableLanguages: [fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: GPUWorks 控制面、GPU 节点、模型部署与推理服务文档。
      footer_center_info: 内容来自 GPUWorks 仓库 docs/
  en:
    label: English
    locale: en-US
    weight: 2
    title: GPUWorks Documentation
    params:
      description: Documentation for the GPUWorks control plane, GPU nodes, model deployment, and inference services.
      footer_center_info: Translated from the GPUWorks repository docs/

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS, handbook]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

outputFormats:
  handbook:
    mediaType: text/html
    baseName: index
    path: handbook
    isHTML: true
    permalinkable: false

params:
  page_width: wide
  offline_search: true
  copyright:
    authors: GPUWorks contributors
    from_year: 2026
  footer_center_info: "内容来自 GPUWorks 仓库 docs/"
  ui:
    dark_mode: true
    image_zoom: true
    typography: system
    theme_color: '#1559bd'
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: false
    docs_sidebar_root: home
    sidebar_icon_policy: groups
    backlinks: true
    sidebar_width_min: 220
    sidebar_width_max: 260
    sidebar_item_overflow: wrap
  github_repo: https://github.com/flitai-io/gpuworks
  github_branch: master
  artifacts_repo: https://github.com/flitai-io/gpuworks-artifacts

# The theme is fetched by build.sh from the gpuworks_website repository into
# themes/oink; it needs hugo extended >= 0.160.1.
theme: oink
