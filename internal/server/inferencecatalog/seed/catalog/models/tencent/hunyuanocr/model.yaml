  # Keep --enforce-eager: CUDA graph capture fails for this model.
  # Engine: vLLM 0.30.0, transformers 5.17.0 (runner cuda13.0-vllm0.30.0-r4).
  # Failure condition: any launch without --enforce-eager (2/2 on one H20-3e,
  # 2026-11-19, HF rev 47644ecc). vLLM runs the model through the Transformers
  # backend (hunyuan_vl), falls back to cudagraph_mode FULL_DECODE_ONLY, and
  # the engine exits at startup while capturing the first graph: RoPE
  # dynamic_frequency_update raises
  # "CUDA error: operation not permitted when stream is capturing".
  # Re-check after a vLLM/transformers bump: launch once without this flag.
  - --enforce-eager
  performance_tradeoffs:
  - param: --enforce-eager
    reason: model_architecture_requires
    detail_en: "vLLM 0.30.0 runs this model through the Transformers backend, whose dynamic RoPE update fails during CUDA graph capture; without this flag 2 of 2 launches on H20-3e exited at startup."
    detail_zh: "vLLM 0.30.0 经 Transformers 通用后端运行该模型，其动态 RoPE 更新在 CUDA 图捕获期间报错；去掉该参数后在 H20-3e 上 2/2 启动失败。"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
