    unpack_to: /opt/gpuworks/runtime
  entrypoint:
  - python3
  - /opt/gpuworks/runtime/gpuworks_serve.py
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.count != 1:\n        return reject(\"runs on one GPU\")\n    if gpu.min_memory_gib < 14:\n        return reject(\"needs a GPU with at least 14 GiB\")\n    return accept(gpu_memory_mib_per_device=14336)\n"
  api:
    health_endpoint: /health
    operations:
    - type: systemone.decide
      endpoint: /v1/systemone
      mode: sync
