    mkdir -p "$snap"
    ln -sfn /models/MiniMax-H3-video-vae/Ref2VA/video_vae "$snap/video_vae"
    ln -sfn /models/MiniMax-H3-audio-vae/Ref2VA/audio_vae "$snap/audio_vae"
  components:
