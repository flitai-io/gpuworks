    role: primary
    weights:
      quantization: nvfp4
      sources:
      - huggingface:
          repo_id: FastVideo/FastH3-Omni-NVFP4-QAD
          revision: f01e6a23ac6066aa9eb622cf94b6259442e70ec2
      - modelscope:
          repo_id: FastVideo/FastH3-Omni-NVFP4-QAD
          revision: aed5d1f3da2d064a22f19e9d97377473813b9425
    weight_bytes: 108583657447
    mount_path: /models/FastH3-Omni-NVFP4-QAD
