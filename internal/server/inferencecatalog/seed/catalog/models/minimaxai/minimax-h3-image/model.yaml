    mkdir -p "$dst"
    for item in "$src"/*; do ln -sfn "$item" "$dst/$(basename "$item")"; done
    rm -f "$dst/model_index.json"
    sed 's#"MiniMaxAI/MiniMax-H3"#"/models/MiniMax-H3"#' "$src/model_index.json" > "$dst/model_index.json"
  components:
  - name: minimax-h3-image
    role: primary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: MiniMaxAI/MiniMax-H3-Image
          revision: 6534ea1c979a5f8cb00c2bd1025d5ca4ee8d8901
      - modelscope:
          repo_id: MiniMax/MiniMax-H3-Image
          revision: 83bdca8ee262e3c06c7c4c1a5962b2fbe10f2665
    weight_bytes: 68663558778
    mount_path: /models/MiniMax-H3-Image
  - name: minimax-h3-text-encoder
    role: auxiliary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: MiniMaxAI/MiniMax-H3
          revision: 42ed227ee7df40d41602854ae760620d6eb651fe
          subfolder: text_encoder
      - modelscope:
          repo_id: MiniMax/MiniMax-H3
          revision: 57559a6720ddaa2eaee52b09ec2ef011127997b2
          subfolder: text_encoder
    weight_bytes: 66726510529
    mount_path: /models/MiniMax-H3
  args:
  - --omni
  - --num-gpus
  - '1'
  - --diffusion-offload-config
  - '{"mode":"layer","components":["dit","text_encoder"]}'
  memlock_unlimited: true
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 1:
              return reject("该档位需要正好 1 张 GPU")
          if gpu.min_memory_gib < 22:
              return reject("单卡显存至少需要 22 GiB")
          return accept(gpu_memory_mib_per_device = 18432)
  # The DiT and the text encoder both stream one block at a time from about
  # 124 GiB of pinned host memory, so host-to-GPU bandwidth sets the pace:
  # 9.53 s per 2048x2048 image on an H20-3e (PCIe 5), 18.3 s on an RTX 4090 and
  # 19.7 s on an A100 (PCIe 4). Measured peaks 11.1-12.7 GiB.
  api:
    health_endpoint: /health
    operations:
    - type: openai.image.generate
      endpoint: /v1/images/generations
      mode: sync
      inputs:
      - name: size
        kind: select
        options:
        - 1024x1024
        - 2048x2048
        - 2720x1536
        - 1536x2720
        - 2368x1760
        - 2496x1664
        - 3136x1344
        default: 1024x1024
      - name: seed
        kind: number
    - type: openai.image.edit
      endpoint: /v1/images/edits
      mode: sync
      request_encoding: multipart
      max_reference_images: 9
      inputs:
      - name: size
        kind: select
        options:
        - 1024x1024
        - 2048x2048
        - 2720x1536
        - 1536x2720
        - 2368x1760
        - 2496x1664
        - 3136x1344
        default: 2048x2048
      - name: seed
        kind: number
input_modalities: [text, image]
