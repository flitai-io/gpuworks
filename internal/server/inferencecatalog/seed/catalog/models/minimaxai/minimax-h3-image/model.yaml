- name: bf16-vllm-nvidia-hopper-sp4
  display_name_zh_cn: Hopper 及以上 · BF16 · 4 卡 Ulysses
  display_name_en: Hopper+ · BF16 · 4 GPUs Ulysses
  scenario: latency
  engine: vllm
  image: vllm/vllm-omni:minimax-h3-image
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: MiniMaxAI/MiniMax-H3-Image
        revision: 6534ea1c979a5f8cb00c2bd1025d5ca4ee8d8901
    - modelscope:
        repo_id: MiniMax/MiniMax-H3-Image
        revision: 83bdca8ee262e3c06c7c4c1a5962b2fbe10f2665
  weight_bytes: 68663558778
  gpus:
    vendor: nvidia
    cc: '>=9.0'
  entrypoint:
  - /bin/sh
  - -c
  - |
    shift
    exec vllm serve /tmp/MiniMax-H3-Image "$@"
  - minimax-h3-image
  # model_index.json names the MiniMax-H3 repository for the Qwen3-VL text
  # encoder. The platform mounts that folder as a component, and the launch
  # directory points model_index.json at the mount, so the pipeline never
  # reaches for the hub (the engine runs with HF_HUB_OFFLINE=1).
  pre_start_script: |-
    set -e
    src=/models/MiniMax-H3-Image
    dst=/tmp/MiniMax-H3-Image
    mkdir -p "$dst"
    for item in "$src"/*; do ln -sfn "$item" "$dst/$(basename "$item")"; done
    rm -f "$dst/model_index.json"
    sed 's#"MiniMaxAI/MiniMax-H3"#"/models/MiniMax-H3"#' "$src/model_index.json" > "$dst/model_index.json"
  components:
  - name: minimax-h3-image
    role: primary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: MiniMaxAI/MiniMax-H3-Image
          revision: 6534ea1c979a5f8cb00c2bd1025d5ca4ee8d8901
      - modelscope:
          repo_id: MiniMax/MiniMax-H3-Image
          revision: 83bdca8ee262e3c06c7c4c1a5962b2fbe10f2665
    weight_bytes: 68663558778
    mount_path: /models/MiniMax-H3-Image
  - name: minimax-h3-text-encoder
    role: auxiliary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: MiniMaxAI/MiniMax-H3
          revision: 42ed227ee7df40d41602854ae760620d6eb651fe
          subfolder: text_encoder
      - modelscope:
          repo_id: MiniMax/MiniMax-H3
          revision: 57559a6720ddaa2eaee52b09ec2ef011127997b2
          subfolder: text_encoder
    weight_bytes: 66726510529
    mount_path: /models/MiniMax-H3
  args:
  - --omni
  - --num-gpus
  - '4'
  - --tensor-parallel-size
  - '1'
  - --usp
  - '4'
  - --text-encoder-tp-size
  - '4'
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 4:
              return reject("该档位需要正好 4 张 GPU")
          if gpu.min_memory_gib < 90:
              return reject("单卡显存至少需要 90 GiB")
          return accept(gpu_memory_mib_per_device = 88064)
  # Ulysses keeps a full DiT on every rank. Measured on 4 x H20-3e: 83.0 GiB
  # peak per GPU (nvidia-smi), 2.55 s per 2048x2048 image.
  api:
    health_endpoint: /health
    operations:
    - type: openai.image.generate
      endpoint: /v1/images/generations
      mode: sync
      inputs:
      - name: size
        kind: select
        options:
        - 1024x1024
        - 2048x2048
        - 2720x1536
        - 1536x2720
        - 2368x1760
        - 2496x1664
        - 3136x1344
        default: 1024x1024
      - name: seed
        kind: number
    - type: openai.image.edit
      endpoint: /v1/images/edits
      mode: sync
      request_encoding: multipart
      max_reference_images: 9
      inputs:
      - name: size
        kind: select
        options:
        - 1024x1024
        - 2048x2048
        - 2720x1536
        - 1536x2720
        - 2368x1760
        - 2496x1664
        - 3136x1344
        default: 2048x2048
      - name: seed
        kind: number
