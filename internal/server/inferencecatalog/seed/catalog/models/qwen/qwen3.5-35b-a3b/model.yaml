- name: int8-sglang-ascend-affd10f8
  display_name_zh_cn: 910B (A2) · INT8 W8A8
  display_name_en: 910B (A2) · INT8 W8A8
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cann9.0-910b-sglang0.5.18-r2
  weights:
    quantization: int8
    sources:
    - huggingface:
        repo_id: KingsonHO/Qwen3.5-35B-A3B-w8a8-mtp
        revision: 6fc7204665f36d3652b0fe649520627909c60351
    - modelscope:
        repo_id: Eco-Tech/Qwen3.5-35B-A3B-w8a8-mtp
        revision: b0f20e173b0bc713261b20281839277a9c676259
  weight_bytes: 39807532097
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --enable-metrics
  - --attention-backend
  - ascend
  - --mm-attention-backend
  - ascend_attn
  - --device
  - npu
  - --dtype
  - bfloat16
  - --mamba-ssm-dtype
  - bfloat16
  - --enable-multimodal
  - --quantization
  - modelslim
  - --trust-remote-code
  - --reasoning-parser
  - qwen3
  - --tool-call-parser
  - qwen3_coder
  env:
    GDN_ATTN_BACKEND_TRITON: '1'
    GLOO_SOCKET_IFNAME: lo
    HCCL_SOCKET_IFNAME: lo
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (37.1 GiB) and a KV pool
          # of 4.0 GiB, within the engine's 0.85 share less about 2 GiB of runtime
          # overhead per card. The scheduler takes the fewest such cards and keeps
          # the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.85 - 2) < 42:
              return reject("the weights and a minimal KV pool need 42 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
