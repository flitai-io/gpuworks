# Qwen3.6-27B's W8A8 quantization is published by the vendor with a
# best-practice file that marks it verified for Atlas A2 inference (910B) and
# Atlas A3 inference (910C), and its model card records the accuracy run on an
# Atlas 800T A3 under vllm-ascend (GPQA 85.415 against 85.4175 in float). The
# arguments below are the vendor's published single-node recipe for those two
# cards, minus what the platform supplies itself (host, port, served name,
# parallel degrees) and minus `--allowed-local-media-path /`, which would widen
# the container's file access beyond the mounted model. `--enable-auto-tool-choice`
# and `--tool-call-parser` are not in the published Ascend command; they are
# carried because they state this model's API surface rather than anything about
# the card, and every vendor's profile of a model has to agree on those
# (TestNonNVIDIAChatSpecsInheritModelFunctionalArgs).
#
# The weight revisions are pinned to commits whose file listing matches the
# repository head. This matters for this model: an intermediate commit of the
# W8A8 repository carries an 8-shard and a 9-shard set side by side under one
# index, 68 GiB of which only half is ever loaded, and pinning that commit makes
# the platform download all of it.
- name: int8-vllm-ascend-07abcfc8
  display_name_zh_cn: 910B (A2) · INT8 W8A8 · 投机解码
  display_name_en: 910B (A2) · INT8 W8A8 · Speculative
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cann9.1-910b-vllm0.26.0rc1-r2
  weights:
    quantization: int8
    sources:
    - modelscope:
        repo_id: Eco-Tech/Qwen3.6-27B-w8a8
        revision: 07abcfc8473691b3aa614006aa52a014b88565ef
  weight_bytes: 32152073342
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --quantization
  - ascend
  - --dtype
  - bfloat16
  - --max-num-seqs
  - '32'
  - --max-model-len
  - '133120'
  - --max-num-batched-tokens
  - '16384'
  - --trust-remote-code
  - --gpu-memory-utilization
  - '0.85'
  - --mm-processor-cache-gb
  - '0'
  - --mm-processor-cache-type
  - shm
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
  - --reasoning-parser
  - qwen3
  - --mm-encoder-tp-mode
  - data
  - --speculative-config
  - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
  - --compilation-config
  - '{"cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - --additional-config
  - '{"enable_cpu_binding":true}'
  env:
    HCCL_BUFFSIZE: '512'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (29.9 GiB) and the KV
          # cache of one 130K-token request (8.1 GiB), which vLLM checks at start,
          # within the engine's 0.85 share less about 2 GiB of runtime overhead
          # per card. The scheduler takes the fewest such cards and keeps the
          # tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.85 - 2) < 39:
              return reject("the weights and one 130K-token request need 39 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each device requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
