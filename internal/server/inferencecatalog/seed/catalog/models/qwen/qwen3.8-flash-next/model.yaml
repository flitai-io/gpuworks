# Ascend 910B (A2), eight cards, TP8 with expert parallelism, W4A8 weights
# with the checkpoint's MTP layer. The switches in --additional-config (CPU
# binding, shared-expert DP, FlashComm1, shared-expert multistream overlap,
# NPUGraph EX), async scheduling, KV sized by --gpu-memory-utilization and
# the environment come from a published vLLM-Ascend v0.32.0rc1 recipe for
# eight NPUs. Four values are not the recipe's: 16 sequences and 8192 batched
# tokens (the recipe has 8 and 4096), decode graphs captured at multiples of
# four up to 64 (one target plus three draft tokens for 16 sequences), and
# OMP_NUM_THREADS 8 (the recipe has 10, which the engine warns against).
# Measured on 8x 910B4 32 GiB on 2026-11-23 against the four-card profiles'
# arguments on the same eight cards, 196 input tokens, thinking off: at 16
# concurrent requests 219 against 193 output tokens/s with 360-token
# outputs and 284 against 234 with 1024-token outputs, median TTFT 1.1-1.6 s
# against 4.3-6.9 s; a single stream decodes 31 tokens/s against 36, and
# with the recipe's own 8 sequences the profile stayed at 164 and 198. The
# floor is the measured card's 32 GiB (11.2 GiB of weights per card; there
# is no fixed KV pool as in the four-card profiles, which need 64 GiB).
# Thinking is off unless a request turns it on
# (chat_template_kwargs.enable_thinking).
# The image is the pinned v0.32.0rc1 openEuler index the four-card profiles
# run; the speculative method is `mtp`, this image's name for the recipe's
# deprecated `qwen3_5_mtp`. The recipe's node-specific settings (HCCL_IF_IP,
# the *_SOCKET_IFNAME interface names) and its jemalloc preload are left
# out. --engram-config maps one copy of the embedding table per rank: the
# run logged 11.9 GiB mapped per rank, about 95 GiB of host memory for eight.
