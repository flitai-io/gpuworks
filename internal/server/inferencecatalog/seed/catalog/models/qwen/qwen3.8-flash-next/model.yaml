  - '{"cudagraph_capture_sizes":[4,8,12,16,20,24,28,32],"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - --speculative-config
  - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
  - --additional-config
  - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
  env:
    VLLM_ASCEND_ENABLE_QSA_E3V: '1'
    VLLM_ASCEND_ENABLE_QSA_LIGHTNING_INDEXER: '1'
  # This image's vllm-ascend wraps the whole initialize_kv_cache() in the
  # discardable kv_cache memory pool, so a level-1 sleep also frees the
  # persistent metadata built there (attention metadata builders, block
  # tables, graph-safe constants) while keeping its virtual address. Sleep and
  # wake still report success and the damage only surfaces on the next real
  # forward pass, where this model's GDN layers make every worker abort at
  # once with ERR00100 "PTA call acl api failed". This pre-start patch applies
  # the upstream fix (vllm-ascend PR #16096, merged after this image was
  # built) to the installed sources; it is digest-pinned to them and fails the
  # container start loudly on any other content instead of half-patching, so
  # an image revision that changes these two files is a deliberate re-pin.
  # Source and builder: build/inference-templates/flash-next-sleep-pool/.
  assets:
  - file: assets/ascend-sleep-pool-patch.tar.gz
    sha256: 100a3ababb730b6df032bb277b79eb9a6550a3fa73c2e237cbaec30d1db20ef6
    size_bytes: 4063
    unpack_to: /opt/gpuworks/ascend-sleep-pool-patch
  pre_start_script: python3 /opt/gpuworks/ascend-sleep-pool-patch/ascend_sleep_pool_patch.py
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 8:
              return reject("the A3 recipe requires exactly 8 logical devices")
          if gpu.min_memory_gib < 64:
              return reject("each device requires at least 64 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": 8, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
# Ascend 910B (A2), four 64 GiB cards, TP4 with expert parallelism. The
# arguments are a launch measured on 4x 910B4 64 GiB on 2026-11-19 (W4A8
# weights, no MTP): 18.65 GiB of weights per card, a fixed 20 GiB KV pool,
# ACL decode graphs, chat traffic served. The same arguments were written for
# and run with the W8A8 weights. --engram-config keeps the 51B-parameter
# per-layer embedding table in host memory: each rank maps its own 23.8 GiB
# copy (dp_shared_memory false), so the node needs about 96 GiB of free RAM
# on top of the page cache for the checkpoint. The image is vLLM-Ascend's
# v0.32.0rc1 openEuler release, pinned by index digest; the NJU quay mirror
# and the public gpuworks SWR copy serve the same digest (quay.io reached
# 50-200 KB/s from a Gitee 910B rental). The MTP profiles add the checkpoints' own BF16 MTP
# layer (method mtp, this image's name for the 910C recipe's deprecated
# qwen3_5_mtp; three draft tokens as in that recipe) and
# move the decode graph sizes to multiples of four (one target plus three
# draft tokens per sequence). Two arguments come from measuring the MTP
# profile on 4x 910B2: --max-num-seqs is 16, since the fixed KV pool holds
# about 1.44M tokens and the previous 4 was a scheduler ceiling, with the
# decode graphs captured up to the matching batch (16, and 64 = 16 x 4 under
# MTP); and the MTP drafter replays graphs (enforce_eager false) where
# vLLM-Ascend's 910C recipe runs it eager, which on its own is +61% single
# stream. Together they measured 268.78 tokens/s of output at concurrency 16
# against 89.49 for the previous arguments, 3.0x, with median TPOT at
# concurrency 1 down from 39.4 to 24.9 ms.
# TORCHNPU_PRECOMPILE_THREADS bounds torch_npu's kernel precompile pool, as in
# the measured launches.
