# vLLM on 8 Hopper cards (H200, H20 96/141 GB, H100 80 GB). This loads the BF16
# checkpoint, the one that was run on hardware (TP8, no expert parallelism):
# 41.9 GiB per card, so it fits an 80 GB card too. The FP8 repo needs
# --enable-expert-parallel at TP8 (its 128-wide quantization blocks do not split
# 8 ways) and was not run, so it is not offered here. --disable-custom-all-reduce
# is required: with sleep mode on, H20 CUDA graph capture fails in
# custom_all_reduce.cuh without it. Context is the model's native 256K.
