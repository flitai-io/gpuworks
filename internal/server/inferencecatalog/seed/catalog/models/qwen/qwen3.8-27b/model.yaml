# The arguments are the vendor's published A2/A3 recipe, with one deliberate
# omission: that recipe pins `--max-model-len 133120`, and pinning it here would
# halve what this profile served before - without it the engine takes the
# model's own 262144, which is what ran on a 910C under this image. A deployment
# that needs the published figure can set it.
