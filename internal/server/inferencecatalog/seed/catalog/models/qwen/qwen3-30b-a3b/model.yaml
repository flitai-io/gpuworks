    - modelscope:
        repo_id: Qwen/Qwen3-30B-A3B
        revision: 8143878278a202cc0ff9ef1bbe00b2abb1adf86d
  weight_bytes: 61084188021
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --dtype
  - bfloat16
  - --reasoning-parser
  - qwen3
  - --enable-auto-tool-choice
  - --tool-call-parser
  - hermes
  env:
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (56.9 GiB) and the KV
          # cache of one 40K-token request (3.8 GiB), which vLLM checks at start,
          # within the engine's 0.9 share less about 2 GiB of runtime overhead per
          # card. The scheduler takes the fewest such cards and keeps the tensor-
          # parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 61:
              return reject("the weights and one 40K-token request need 61 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
