# The BF16 profile above carries no tuning because upstream publishes no BF16
# command for this model - its hardware table lists BF16, but every command on
# the page serves the W8A8 checkpoint. This profile is that command: four
# devices, tensor parallel with expert parallelism, which a mixture-of-experts
# model needs and the BF16 profile does not ask for. Upstream also pairs it
# with an EAGLE3 draft; that part is left out because the draft it names is
# given as a bare host path with no published repository.
