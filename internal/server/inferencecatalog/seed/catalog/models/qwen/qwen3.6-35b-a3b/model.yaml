# The 910B and 910C profiles above run sglang; this is the vendor's published
# vLLM recipe for 950DT, which serves the model on one device from MXFP8
# weights of its own. Static kernel generation makes the first start slow - the
# engine is not ready until graph capture finishes. No 950DT hardware was
# available, so these arguments are the published recipe, not a measured one.
- name: mxfp8-vllm-ascend-950dt-c275cc09
  display_name_zh_cn: 950DT · MXFP8 · 投机解码
  display_name_en: 950DT · MXFP8 · Speculative
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cann9.2-950-vllm0.30.0rc2-r1
  weights:
    quantization: mxfp8
    sources:
    - modelscope:
        repo_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8
        revision: c275cc095c8c3eb13c326e3f70b9dd0fd2021c98
  weight_bytes: 39706993876
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])950DT([^A-Za-z0-9]|$)
  args:
  - --quantization
  - ascend
  - --trust-remote-code
  - --safetensors-load-strategy
  - lazy
  - --max-model-len
  - '135168'
  - --max-num-seqs
  - '128'
  - --max-num-batched-tokens
  - '4096'
  - --gpu-memory-utilization
  - '0.90'
  - --enable-prefix-caching
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
  - --reasoning-parser
  - qwen3
  - --mm-encoder-tp-mode
  - data
  - --speculative-config
  - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
  - --compilation-config
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - --additional-config
  - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
  env:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_PROC_BIND: 'false'
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    TASK_QUEUE_ENABLE: '1'
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (37.0 GiB) and the KV
          # cache of one 132K-token request (2.6 GiB), which vLLM checks at start,
          # within the engine's 0.9 share less about 2 GiB of runtime overhead per
          # card. The scheduler takes the fewest such cards and keeps the tensor-
          # parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 40:
              return reject("the weights and one 132K-token request need 40 GiB; these cards offer less")
          if gpu.min_memory_gib < 96: return reject("each device requires at least 96 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
