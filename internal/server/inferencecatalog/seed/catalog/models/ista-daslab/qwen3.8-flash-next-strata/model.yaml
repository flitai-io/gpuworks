- <<: *strata_runner
  name: iq3-s-strata-nvidia
  display_name_zh_cn: Turing 及以上 · IQ3_S · Strata r5
  display_name_en: Turing+ · IQ3_S · Strata r5
  weights:
    quantization: GSQ-RCO IQ3_S
    sources:
    - huggingface:
        repo_id: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
        revision: ed59f92082b1e93c0e96d60a8b11aab089b52f09
        subfolder: IQ3_S
    - modelscope:
        repo_id: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
        revision: 1868010e27505d4b8cc15970cdcc4dd76005d7de
        subfolder: IQ3_S
  weight_bytes: 83617662656
