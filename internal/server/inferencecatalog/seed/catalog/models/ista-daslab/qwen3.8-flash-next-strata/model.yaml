  name: q2-0-strata-nvidia
  display_name_zh_cn: Turing 及以上 · Q2_0 · Strata r5
  display_name_en: Turing+ · Q2_0 · Strata r5
  weights:
    quantization: GSQ-RCO Q2_0
    sources:
    - huggingface:
        repo_id: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
        revision: ed59f92082b1e93c0e96d60a8b11aab089b52f09
        subfolder: Q2_0
    - modelscope:
        repo_id: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
        revision: 1868010e27505d4b8cc15970cdcc4dd76005d7de
        subfolder: Q2_0
  weight_bytes: 66423878624
  args:
  - --model
  - ${MODEL_PATH}
  - --host
  - ${API_HOST}
  - --port
  - ${API_PORT}
  - --model=Q2_0
- <<: *strata_runner
  name: iq3-xxs-strata-nvidia
  display_name_zh_cn: Turing 及以上 · IQ3_XXS · Strata r5
  display_name_en: Turing+ · IQ3_XXS · Strata r5
  weights:
    quantization: GSQ-RCO IQ3_XXS
    sources:
