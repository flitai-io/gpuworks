- name: fp4-sglang-nvidia-h200-tp4-engram-host
  display_name_zh_cn: H20 / H200 · FP4 · 4 卡 · Engram 卸载
  display_name_en: H20 / H200 · FP4 · 4 GPUs · Engram offload
  scenario: balanced
  engine: sglang
  image: lmsysorg/sglang:dev-dsv41
  weights:
    quantization: fp4
    sources:
    - huggingface:
        repo_id: deepseek-ai/DeepSeek-V4.1-Flash-1017
        revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  weight_bytes: 510296708312
  gpus:
    vendor: nvidia
    name: (^|[^A-Za-z0-9])(?:H200|H20)([^A-Za-z0-9]|$)
  args:
  - --trust-remote-code
  - --ep-size
  - '4'
  - --mem-fraction-static
  - '0.8'
  - --attention-backend
  - dsv4
  - --moe-runner-backend
  - flashinfer_mxfp4
  - --enable-decoder-swa-bounded-replay
  - --cuda-graph-max-bs-decode
  - '64'
  - --reasoning-parser
  - auto
  - --tool-call-parser
  - auto
  - --enable-metrics
  env:
    SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
  placement:
    language: starlark
    resolver: |
      # The ~196 GB Engram tables live in host memory, so each GPU holds about
      # 73 GB of backbone (measured on 4x H200): admission asks for that plus
      # compile/graph headroom, not weight_bytes / 4. Admission also checks
      # each card's reported capacity.
      def resolve(gpu):
          if gpu.count != 4:
              return reject("this recipe requires exactly 4 GPUs per node")
          return accept(gpu_memory_mib_per_device=88000,
                        variables={"TP_SIZE": 4, "SP_DEGREE": 1})
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
- name: fp4-sglang-nvidia-h200-tp4-engram-host-dspark
  display_name_zh_cn: H20 / H200 · FP4 · 4 卡 · Engram 卸载 · 投机解码
  display_name_en: H20 / H200 · FP4 · 4 GPUs · Engram offload · Speculative
  scenario: balanced
  engine: sglang
  image: lmsysorg/sglang:dev-dsv41
  weights:
    quantization: fp4
    sources:
    - huggingface:
        repo_id: deepseek-ai/DeepSeek-V4.1-Flash-1017
        revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  weight_bytes: 510296708312
  gpus:
    vendor: nvidia
    name: (^|[^A-Za-z0-9])(?:H200|H20)([^A-Za-z0-9]|$)
  args:
  - --trust-remote-code
  - --ep-size
  - '4'
  - --mem-fraction-static
  - '0.8'
  - --attention-backend
  - dsv4
  - --moe-runner-backend
  - flashinfer_mxfp4
  - --enable-decoder-swa-bounded-replay
  - --speculative-algorithm
  - DSPARK
  - --speculative-dspark-block-size
  - '5'
  - --context-length
  - '262144'
  - --cuda-graph-max-bs-decode
  - '32'
  - --reasoning-parser
  - auto
  - --tool-call-parser
  - auto
  - --enable-metrics
  env:
    SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
  placement:
    language: starlark
    resolver: |
      # The ~196 GB Engram tables live in host memory, so each GPU holds about
      # 73 GB of backbone plus the 2 GB DSpark head (measured on 4x H200):
      # admission asks for that plus compile/graph headroom, not
      # weight_bytes / 4. Admission also checks each card's reported capacity.
      # DSpark's decode-graph capture allocates a
      # 12 GiB index tensor at the 1M default context, which does not fit next
      # to the KV pool; 256K context leaves room for it.
      def resolve(gpu):
          if gpu.count != 4:
              return reject("this recipe requires exactly 4 GPUs per node")
          return accept(gpu_memory_mib_per_device=88000,
                        variables={"TP_SIZE": 4, "SP_DEGREE": 1})
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
