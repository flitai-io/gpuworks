# Gemma 4 is the one model upstream declares for every Ascend generation at
# once - A2, A3 and the 950 series - and it has no W8A8 quantization: the BF16
# checkpoint is what runs on 910B and 910C. The published recipe is four
# devices with tensor parallelism and the ACLGraph decode mode; upstream also
# gives an eager variant (drop --compilation-config, add --enforce-eager) for
# hosts where graph capture misbehaves. BF16 weights must NOT be served with
# `--quantization ascend` - only the MXFP4 checkpoints carry the quantization
# description the flag reads. Upstream marks this model experimental and its
# own numbers "for reference only", and names no minimum engine version; no
# Ascend hardware was available here, so these arguments are the published
# recipe rather than a measured one.
- name: bf16-vllm-ascend-c7a493cd
  display_name_zh_cn: 910B (A2) · BF16
  display_name_en: 910B (A2) · BF16
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cann9.1-910b-vllm0.26.0rc1-r2
  weights:
    quantization: bf16
    sources:
    - modelscope:
        repo_id: google/gemma-4-31B-it
        revision: c7a493cd69771548e767c0273cc19fe1c15d7513
  weight_bytes: 62578686659
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --dtype
  - bfloat16
  - --max-model-len
  - '32768'
  - --trust-remote-code
  - --enable-auto-tool-choice
  - --tool-call-parser
  - gemma4
  - --reasoning-parser
  - gemma4
  - --chat-template
  - /model/chat_template.jinja
  - --compilation-config
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (58.3 GiB) and the KV
          # cache of one 32K-token request (30.0 GiB), which vLLM checks at start,
          # within the engine's 0.9 share less about 2 GiB of runtime overhead per
          # card. The scheduler takes the fewest such cards and keeps the tensor-
          # parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 89:
              return reject("the weights and one 32K-token request need 89 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each device requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
