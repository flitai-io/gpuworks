model_id: microsoft/phi-4-mini-reasoning
source: user
display_title: Phi-4-mini-reasoning
release_date: '2025-04-29'
model_config: {model_type: phi3, num_hidden_layers: 32, hidden_size: 3072, num_attention_heads: 24, num_key_value_heads: 8, max_position_embeddings: 131072, sliding_window: 262144}
kv_bytes_per_token:
  vllm: 131072
  sglang: 131072
specs:
- name: bf16-vllm-ppu-zw810e-async-decode-graph
  display_name_zh_cn: ZW810E · BF16 · 异步解码图（实验）
  display_name_en: ZW810E · BF16 · Async decode graph (experimental)
  scenario: latency
  engine: vllm
  image: gpuworks/gpuworks-runner:hggc13.0-vllm0.23.0-r2
  weights:
    quantization: bf16
    sources:
    - modelscope:
        repo_id: microsoft/Phi-4-mini-reasoning
        revision: 6cc624dc0e38ec11d8c61cde084abb33e28ebbb4
  weight_bytes: 7672066216
  gpus:
    vendor: ppu
    name: (^|[^A-Za-z0-9])(?:PPU[ _-]?)?ZW810E([^A-Za-z0-9]|$)
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.nnodes != 1 or gpu.count != 1 or gpu.min_memory_gib < 96:
              return reject("requires one ZW810E with at least 96 GiB on one node")
          return accept(gpu_memory_mib_per_device=22528,
                        variables={"GPU_COUNT": 1, "TP_SIZE": 1, "SP_DEGREE": 1})
  args:
  - --dtype
  - bfloat16
  - --max-model-len
  - '2048'
  - --max-num-seqs
  - '4'
  - --max-num-batched-tokens
  - '4096'
  - --gpu-memory-utilization
  - '0.22'
  - --no-enable-prefix-caching
  - --async-scheduling
  - --trust-remote-code
  - --compilation-config
  - '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,3,4]}'
  env:
    OMP_NUM_THREADS: '2'
  shm_bytes: 1073741824
  start_timeout_sec: 315
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
input_modalities: [text]
