  # librocm_smi64.so.2。构建容器里没有宿主驱动库，所以 dtk 档的 import 断言只到
  # 「模块可定位」，真 import 由真机验证覆盖。
  # PPU 与 DCU 都没有 arm64 供给，这两类档只出 amd64。

