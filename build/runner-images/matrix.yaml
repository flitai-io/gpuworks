      不同，因此两档共享 base 的全部层（前提是 base 只压一次，见本线说明）。
      r3 加 PPU 同机 PD 补丁（hggc/ppu-pd，pdmode sglang-ppu-ipc），只在 PD 的
      环境变量打开时生效；r2 → r3 只多这一层，r2 的部署照常可用。

