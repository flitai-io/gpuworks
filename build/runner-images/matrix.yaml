# gpuworks-runner 自建镜像矩阵
#
# 本文件是每一档镜像的权威定义：构建什么、以什么为 base、必须具备什么。
# 读这一个文件就能知道某档是干什么用的、有什么前提、有什么已知限制。
# 补丁的第三方署名见 NOTICE。
# 构建与发布怎么跑见 README.md；真机验证结论见 artifacts/work/2026-10-03-runner-images/evidence/r2-verify.md。
#
# tag 命名：<backend><框架档>[-<型号>]-<engine><版本>，并发一个带构建版次的不可变
# tag <同名>-<revision>。推理目录（seed catalog）一律引用带 revision 的不可变 tag；
# 裸 tag 只作人用别名，会被后续版次移动。
#
# 字段：
#   id          矩阵项 ID，同时就是裸 tag 名
#   revision    构建版次（r1、r2…）。配方变了必须 +1，不许原地覆盖同名 tag：
#               节点上已有同名镜像时不会重拉，覆盖等于改了没生效
#   backend     cuda | cann | dtk | hggc | metal | rocm
#   builder     缺省为本目录的 buildx 构建。host-env 表示 macOS 宿主环境包：由
#               build/host-envs/build.sh 构建（框架档 = 最低 macOS），本目录的
#               build.sh / verify.sh 跳过它，push.sh / publish.py 照常分发
#   engine      vllm | sglang | callable（目录引擎；仅作说明，generate() 按 id 解析）。
#               build.sh 用它选 Dockerfile（<backend>/Dockerfile.<engine>）：非常规的
#               构建配方（如 vllm-v100）用带后缀的值指到自己的 Dockerfile
#   catalog     false = 照常构建、验证、发布，但不写进系统镜像目录（catalog-seed.json）：
#               产品既不列出它，自动选镜像也看不到它，直到它在真机上跑通、并有推理模板
#               以 image 引用它。缺省为列出。id 无论如何都按文法校验
#   platforms   buildx platforms（缺省取 defaults）
#   base        上游或厂商的公开原件。不用公司内部二次封装的镜像；构建前由
#               shared/check_vendor_base.sh 拦截带内部封装痕迹的 base
#   args        传给 Dockerfile 的 --build-arg。各后端的 Dockerfile 头部是权威定义，
#               跨档出现的几个：
#                 MOONCAKE               ""=不要 / base=沿用 base 自带 / npu=装 npu 变体
#                 OMNI_IN_BASE           omni 由 base 自带时记其版本（只用于自描述）
#                 PATCHES_NOT_APPLICABLE 本档 base 上确实不适用的补丁；声明过期会失败
#                 PURGE_STUB_PKGS        base 里被 pip uninstall 卸干净、却留下空目录
#                                        的包名。PEP 420 会把这种空目录变成遮蔽真包的
#                                        命名空间包，必须删掉；声明过期（目录不存在或
#                                        里面有文件）会失败
#                 TORCHCODEC_SPEC        base 自带的 torchcodec 与本档 CUDA 不匹配时，
#                                        用它显式替换成正确的构建
#                 OMNI_PATCHES_NOT_APPLICABLE  昇腾 omni 档：本档 base 的 vllm_omni 上确实
#                                        不适用的 omni 补丁；声明过期会失败
#                 VOXCPM_SPEC / DECORD_SPEC / MOVIEPY_SPEC  cuda vllm 线按档加装的模型专属依赖
#                                        （见 cuda/Dockerfile.vllm「模型专属依赖」）
#                 DTK_VLLM_PATCHES       "1"=dtk vllm 档应用 patches/vllm_dtk/（严格应用，且要经得起
#                                        重跑 vllm-hcu-apply-patches）；不传则不打
#   requires    本档必须成立的断言，构建末尾与 verify.sh 都会检查，不过即失败：
#                 engine            引擎本体装对（元数据 + 模块可定位）
#                 engine_import     真的 import 成功；vllm 档另断言
#                                   import vllm.multimodal.media.audio 与
#                                   （已装时）import torchcodec——这是 vllm serve
#                                   的 CLI 启动路径，import vllm 本身覆盖不到
#                 omni              vllm-omni 在位
#                 omni_no_mooncake  mooncake-transfer-engine-npu 的 pip 包与模块
#                                   都不存在（昇腾 omni 档，理由见该线说明）
#                 omni_patched      vllm_omni 补丁清单无 failed，且 Ming 的 NPU
#                                   补丁确实在文件里
#                 indextts2_frontend IndexTTS 2.5 的文本前端：fugashi 能用 unidic-lite
#                                   分词；x86_64 上 tn（WeTextProcessing）能 import
#                 voxcpm            VoxCPM2 用的原生 voxcpm 包能经 vllm-omni 自己的
#                                   查找路径 import
#                 decord            decord 模块（由 decord2 提供）能解出合成视频的帧
#                 moviepy           moviepy 能 import 并构造一个 ColorClip
#                 mooncake          mooncake 传输引擎在位（plain / cuda13 改名包 / npu 变体）
#                 diffusion         diffusers 与 cv2 等 diffusion 依赖在位
#                 audit             离线组件审计门通过（components.json status=PASS）
#                 hcu_patches       vllm-hcu-apply-patches 在 PATH 上（海光）
#                 ppu_pd            sglang 装了 PPU 同机 PD 补丁（hggc/ppu-pd），
#                                   且 mooncake 在位
#                 mooncake_load_errors  vLLM 的 MooncakeConnector 把拉取失败的块上报给调度器
#                                   （patches/vllm_dtk/001），且 mooncake 在位
#                 mooncake_hybrid   GDN/Mamba 混合模型的 vllm-mooncake PD 补丁在位
#                                   （patches/vllm_dtk/002、003、004），且 mooncake_load_errors 成立
#   base_requires_clean_history
#               true = 该 base 的 image history 里有内网凭据，必须先用
#               prepare-base.sh 在 base 这一层压掉 history，再以干净 base 构建；
#               build.sh 构建前校验，不干净直接拒绝
#   base_note   为什么选这个 base、怎么拿到它
#   note        这一档干什么用、硬件与驱动前提、有什么没什么、已知限制

defaults:
  platforms: [linux/amd64, linux/arm64]

items:

  # =======================================================================
  # AMD ROCm
  # =======================================================================
  # The upstream vLLM ROCm image ships kernels for gfx90a/gfx942/gfx950,
  # gfx1100/1101/1150/1151 and gfx1200/1201. Tested on MI325X (gfx942, single
  # card and 2-node PP/TP over RCCL) and Ryzen AI Max+ 395 (gfx1151, UMA).
  - id: rocm7.2.3-vllm0.30.0
    revision: r1
    backend: rocm
    engine: vllm
    platforms: [linux/amd64]
    base: vllm/vllm-openai-rocm@sha256:2e7da1ad1c66836802072588adea75f9f4991da5f9545b4318e91d422c22ce6a
    args: {ENGINE_VERSION: "0.30.0", FRAMEWORK_VERSION: "7.2.3"}
    requires: [engine]
    note: vLLM 0.30.0 on ROCm 7.2.3 (upstream vllm-openai-rocm); tested on MI325X (gfx942) and AMD395 (gfx1151).

  # Unpublished pinned MI300X SGLang candidate; not hardware-validated, so it
  # stays out of the built-in catalog.
  - id: rocm7.2.0-sglang0.5.21
    revision: r1
    backend: rocm
    engine: sglang
    catalog: false
    platforms: [linux/amd64]
    base: lmsysorg/sglang@sha256:0534eb382626ef55ace8be24f7d81cc6eb7451acac8a5727848397a5e9309d91
    args: {SGLANG_VERSION: "0.5.21", FRAMEWORK_VERSION: "7.2.0"}
    requires: [engine]
    note: Unpublished pinned MI300X ROCm candidate; no gfx1151 compatibility claim.

  # =======================================================================
  # NVIDIA CUDA
  # =======================================================================
  # 框架档只做上游实际提供 base 的版本：cuda13.0 与 cuda12.9。cuda12.8 上游没有
  # vllm 的 base（sglang 仅有 B200 专用的 -cu128-b200 旧版），cuda13.3 不存在，
  # cuda13.4 等上游出 stable 再补。
  #
  # vllm 与 omni 分两档，不合并，原因是合并的代价落在所有负载头上：
  #   1) vllm-omni 把 transformers 钉到 <5.15、accelerate 钉到 1.12.0、
  #      diffusers 钉到 0.40.0，而普通 vllm 对 transformers 不设上界；
  #   2) vllm-omni 在 import 期替换 vllm 的 EngineCoreOutput、TokensPrompt 等内部
  #      类型，需要 patches/vllm_omni/001 按 argv 里有无 --omni 来旁路；
  #   3) 推理目录里 nvidia 的 vllm spec 是 517 普通 : 27 omni，收益面很小。
  # 分档几乎没有代价：omni 相关包约 280 MB，两档同一 base，同仓库内大层完全去重。

  - id: cuda13.0-vllm0.30.0
    revision: r4
    backend: cuda
    engine: vllm
    base: vllm/vllm-openai:v0.30.0
    base_note: 上游默认构建即 CUDA 13.0.x，同名 tag 含 aarch64
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "base"
      ENGINE_VERSION: "0.30.0"
      FRAMEWORK_VERSION: "13.0"
      DECORD_SPEC: "decord2==3.4.0"
      MOVIEPY_SPEC: "moviepy==2.2.1"
    requires: [engine, engine_import, decord, moviepy, mooncake, overlays, audit]
    note: >-
      CUDA 13 的默认档，普通文本/多模态推理负载用。不含 vllm-omni，transformers
      不设上界。mooncake 由 base 预装（cuda13 的包名是 mooncake-transfer-engine-cuda13）。
      r3 加装 decord2（import 名 decord），ERNIE-4.5-VL 的 HF 动态模块要它；PyPI 的 decord
      只有 x86_64 wheel，所以不用它。r4 再加装 moviepy：同一个动态模块还直接 import 它。

  - id: cuda13.0-vllm-omni0.30.0
    revision: r4
    backend: cuda
    engine: vllm
    base: vllm/vllm-openai:v0.30.0
    base_note: 与默认档同一 base，同仓库内大层去重
    args:
      VLLM_OMNI_VERSION: "0.30.0"
      MOONCAKE: "base"
      ENGINE_VERSION: "0.30.0"
      FRAMEWORK_VERSION: "13.0"
      VOXCPM_SPEC: "voxcpm==2.0.3"
    requires: [engine, engine_import, omni, indextts2_frontend, voxcpm, mooncake, overlays, audit]
    note: >-
      omni 档，给 vllm-omni 独家支持的负载用（Qwen3-TTS、Ming-omni-tts、图像与
      视频生成等）。代价是 transformers 被压到 <5.15、accelerate 钉到 1.12.0，
      所以普通负载请用默认档。不声明 diffusion：omni 自带 diffusers 但不带 opencv，
      与 sglang 的 diffusion 扩展不是一回事。r3 加装 vllm-omni 的 indextts2 前端
      （fugashi、unidic-lite，x86_64 另有 WeTextProcessing）；arm64 上没有 pynini 的 cp312 wheel，
      所以 IndexTTS 2.5 的中英文文本规范化只在 x86_64 上可用。r4 以 --no-deps 加装 voxcpm
      （VoxCPM2 用），并打 omni 补丁 003（MOSS-TTS-Realtime 参考音频编码的设备不一致）。

  - id: cuda13.0-sglang0.5.21
    revision: r2
    backend: cuda
    engine: sglang
    base: lmsysorg/sglang:v0.5.21-cu130
    base_note: 上游官方双架构 manifest
    args:
      SGLANG_VERSION: "0.5.21"
    requires: [engine, engine_import, diffusion, overlays]
    note: >-
      CUDA 13 的 sglang 档，含 diffusion 依赖（从 base 的 sglang 源码树安装，
      装不上即构建失败）。

  # cuda12.9 的 vllm 档需要替换 base 里的 torchcodec，原因与做法：
  #   上游 v0.31.0-cu129 的 torch 栈自洽（torch 2.13.0+cu129、torchvision 0.28.0+cu129、
  #   torchaudio 2.11.0+cu129），但镜像里的 torchcodec 0.17.0 是 CUDA 13 构建——
  #   libtorchcodec_core*.so 依赖 libnvrtc.so.13 / libcudart.so.13，而镜像里只有 .12，
  #   于是 import torchcodec 抛 OSError。vllm 的 multimodal/media/audio.py 只捕获
  #   ImportError 与 RuntimeError，接不住 OSError，所以 vllm serve 在 CLI 导入阶段
  #   就崩，任何硬件上都起不来。成因是上游用 uv + --extra-index-url .../whl/cu129 解析
  #   依赖，而 cu129 索引里 torchcodec 只到 0.16.0，PyPI 的 0.17.0（Linux 默认 CUDA 13）
  #   版本号更高被选中。-cu129-ubuntu2404 变体同样是 0.17.0，换 base 不解决。
  #   做法：用 PyTorch 官方 cu129 索引的 torchcodec 0.16.0+cu129 以 --no-deps 替换
  #   （torchcodec 0.14~0.17 都只要求 torch>=2.11，vllm 要求 >=0.14，所以满足）。
  #   pip_guard 把这一次替换作为按档声明的例外记进 /opt/gpuworks/base-replaced.json，
  #   其余受守卫的包（torch 全家、triton、nvidia-*、cuda-*、flashinfer、xformers、vllm）
  #   仍一概不许变。
  # 另外 v0.30.0-cu129 这个 tag 整体是坏的（torch 2.14.0+cu130、torchvision 无法 import），
  # 不要用它作 base。

  - id: cuda12.9-vllm0.31.0
    revision: r2
    backend: cuda
    engine: vllm
    base: vllm/vllm-openai:v0.31.0-cu129
    base_note: >-
      cu129 线上 torch 栈自洽的版本（torch 2.13.0+cu129，NCCL cu12 2.30.7）；
      不是 -cu129-ubuntu2404 变体。torchcodec 需替换，见上方说明。
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "base"
      ENGINE_VERSION: "0.31.0"
      FRAMEWORK_VERSION: "12.9"
      TORCHCODEC_SPEC: "torchcodec==0.16.0+cu129"
      TORCHCODEC_INDEX_URL: "https://download.pytorch.org/whl/cu129"
      PATCHES_NOT_APPLICABLE: "001_wrong_dp_ray.patch"
    requires: [engine, engine_import, mooncake, overlays, audit]
    note: >-
      CUDA 12.x 的 vllm 档（驱动低于 580 的节点用它，CUDA 13.0 要求驱动 ≥580）。
      不含 omni。torchcodec 换成 0.16.0+cu129，其余 torch 栈与 base 逐包一致。
      补丁 001（wrong_dp_ray）在 vllm 0.31 上打不上：上游只是重排了 get_open_port 的
      docstring（vllm #52136），端口问题本身没有修，故暂由 PATCHES_NOT_APPLICABLE 声明跳过，
      下次升 revision 时要按 0.31 的上下文重做 001。002 应用。

  - id: cuda12.9-sglang0.5.18
    revision: r2
    backend: cuda
    engine: sglang
    base: lmsysorg/sglang:v0.5.18-cu129
    base_note: cu129 线上最新的官方 sglang 档（0.5.21 没有 cu129 构建）
    args:
      SGLANG_VERSION: "0.5.18"
    requires: [engine, engine_import, diffusion, overlays]
    note: CUDA 12.x 的 sglang 档，含 diffusion 依赖。

  # -----------------------------------------------------------------------
  # NVIDIA Volta（V100 / V100S，sm_70）：1Cat-vLLM
  # -----------------------------------------------------------------------
  # 上游 vLLM 的预编译 wheel 与官方镜像不含 sm_70 内核（其 docker/versions.json 的
  # TORCH_CUDA_ARCH_LIST 从 7.5 起），上面所有 cuda vllm 档在 V100 上都以
  # "CUDA error: no kernel image is available for execution on the device" 结束
  # （CompShare V100S x2，l4-compshare-single-vm-tp2-dgpu，2026-10-19、22 三次）。
  # 1Cat-vLLM 是把 Volta 作为一等目标的 vLLM 分支（Apache-2.0）：自带 sm_70 内核与
  # FLASH_ATTN_V100 注意力后端，console script 与模块名仍是 vllm，`vllm serve` 用法不变。
  # 它的发行包名是 1cat-vllm，版本号是它自己的（1.5.1），引擎版本在 id 里写作 1cat1.5.1。
  #
  # 为什么 catalog: false：镜像目录的自动选择只看引擎、框架、架构（ADR 0019，不看 GPU 型号），
  # 把它列进去，V100 以外的节点在更老的框架档上可能被它误选，V100 节点又选不到它。
  # V100 由推理模板的 spec 以 `gpus: {vendor: nvidia, cc: '7.0'}` + `image:` 引用它，
  # 镜像不在目录里，spec 自己在 image_sources 里列出 SWR / quay / registry.zstack.ai 副本
  # （seed 的 TestBuiltinTemplateSystemImagesResolveToImageCatalogRows 守护）。

  - id: cuda12.8-v100-vllm1cat1.5.1
    revision: r1
    backend: cuda
    engine: vllm-v100
    platforms: [linux/amd64]
    catalog: false
    base: nvidia/cuda:12.8.1-devel-ubuntu24.04
    base_note: >-
      官方 devel 镜像。要 devel 而不是 runtime：1Cat-vLLM 的 TileLang 内核在首次推理时
      用 nvcc 即时编译，没有 CUDA 12.8 工具链推理直接 500；ubuntu 24.04 满足它要求的
      GLIBC >= 2.38 与 python3.12。
    args:
      ENGINE_VERSION: "1cat1.5.1"
      FRAMEWORK_VERSION: "12.8"
      ONECAT_VERSION: "1.5.1"
      ONECAT_WHEEL_SHA256: "757f2200ba6bd20f7e3e5c8fc68c7e05461df6d284baf676ac0c16ce19434959"
    requires: [engine]
    note: >-
      V100 / V100S（sm_70）专用 vllm 档，引擎是 1Cat-vLLM 1.5.1（PyTorch 2.10.0+cu128，
      Python 3.12）。驱动要求 >= 570.124.06。不含 omni、mooncake、diffusion。
      r1 已在 CompShare V100S x2 上由 L4 用例 l4-compshare-single-vm-tp2-dgpu 跑通
      （TP2 部署 + chat + dGPU 副本共享一张卡，2026-10-25），引擎参数带显式
      `--attention-backend FLASH_ATTN_V100`；不带该参数时是否自动选对尚未验证。
      V100 之外的卡请用其它 cuda 档。

  # =======================================================================
  # Ascend CANN —— vllm 线（不含 omni）
  # =======================================================================
  # 本线一律不装 PyPI 的 vllm-omni：把它装进 vllm-ascend 后，vllm 的 registry 检查
  # 子进程一加载它的 vllm.general_plugins 入口就 SIGABRT（glibc 堆损坏），影响该镜像
  # 里的所有负载，与 omni 版本是否对齐无关。昇腾的 omni 负载请用下面的 vllm-omni 线
  # （base 自带 NPU 原生构建）。
  #
  # 驱动前提是选档的关键：vllm-ascend 0.27.1rc1 线要求 Ascend HDK ≥ 26.1.1，在
  # 26.0.rc1 上引擎初始化即崩；0.26.0rc1 线在 26.0.rc1 上可用。按机队驱动选档。

  - id: cann9.1-910b-vllm0.26.0rc1
    revision: r2
    backend: cann
    engine: vllm
    base: quay.io/ascend/vllm-ascend:v0.26.0rc1
    base_note: 上游 quay 原件，内部 CANN 为 9.1.0
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "npu"
    requires: [engine, mooncake, overlays]
    note: >-
      910B，**驱动 26.0.rc1 可用**，也可在 26.1.1 上跑。驱动未升级到 26.1.1 的机队
      选本档，不要选 0.27.1rc1。含 NPU 版 mooncake，PD 分离（vllm-ascend-mooncake
      模式）用本线。

  - id: cann9.1-a3-vllm0.26.0rc1
    revision: r2
    backend: cann
    engine: vllm
    base: quay.io/ascend/vllm-ascend:v0.26.0rc1-a3
    base_note: 上游 quay 原件的 A3 变体
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "npu"
    requires: [engine, mooncake, overlays]
    note: A3（910C），其余同 910b 档。

  - id: cann9.1-910b-vllm0.27.1rc1
    revision: r2
    backend: cann
    engine: vllm
    base: quay.io/ascend/vllm-ascend:v0.27.1rc1
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "npu"
    requires: [engine, mooncake, overlays]
    note: >-
      910B，**要求 Ascend HDK ≥ 26.1.1**（driver 与 firmware 都要到位）。在 26.0.rc1
      上该栈的引擎初始化子进程会堆损坏崩溃，升级驱动前请用 0.26.0rc1 档。
      含 NPU 版 mooncake。

  - id: cann9.1-a3-vllm0.27.1rc1
    revision: r2
    backend: cann
    engine: vllm
    base: quay.io/ascend/vllm-ascend:v0.27.1rc1-a3
    args:
      VLLM_OMNI_VERSION: ""
      MOONCAKE: "npu"
