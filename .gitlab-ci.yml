  environment:
    name: cloud-test/compshare/provider
    action: prepare
  script:
    - make test-l4-compshare-provisioning-matrix

# A server-dialed agent on a CompShare container instance: the server dials
# the TCP port the driver opened and forwarded. Under cloud-test/compshare/*
# for the credential scope. The VM counterpart runs inside
# l4-compshare-provisioning-matrix. Same single-instance lane as the other
# one-VM compshare jobs.
l4-compshare-server-dial-node-onboarding-container:
  extends: .l4-acceptance
  # go test -timeout is 85m: up to 30m (COMPSHARE_STOCK_WAIT) waiting out a
