stages:
  - change-record
  - core-prepare
  - core
  - release
  - publish
  - l4-acceptance

default:
  interruptible: true

# Run validation for merge requests, the default branch and release tags
# (vYY.M.PATCH, docs/dev/release.md#版本号). Ordinary feature branch and other
# tag pushes do not create pipelines until a merge request exists; scheduled,
# web, API, and trigger pipelines remain available explicitly.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

variables:
  # Workspaces are shared across executor slots on the shell runners. Docker
  # jobs keep TMPDIR inside the workspace (the DinD daemon only mounts
  # $CI_PROJECT_DIR, so bind-mounted model dirs must live under it) and
  # engine containers write root-owned files there; if a runner-killed job
  # skips its after_script prune, git clean must not try to delete .tmp or
  # every later job reusing that workspace fails checkout with Permission
  # denied. Excluded for ALL jobs — any job can be the victim, not just the
  # docker one that produced the leftover. .docker-core prunes .tmp after
  # each run so the exclusion cannot leak unbounded growth.
  GIT_CLEAN_FLAGS: "-ffdx -e .tmp/"
  # Servers started by CI jobs never send usage reports (ADR 0054).
  GPUWORKS_USAGE_REPORT: "off"
  # The scripts read CI-neutral names (the GitHub workflows set the same):
  # the commit, one build time shared by every job of the pipeline, and the
  # commit check_architecture.sh compares the budget file against.
  GPUWORKS_BUILD_COMMIT: "$CI_COMMIT_SHA"
  GPUWORKS_BUILT_AT: "$CI_PIPELINE_CREATED_AT"
  GPUWORKS_ARCH_BASELINE: "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

.go-core:
  image:
    name: golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e
  variables:
    # gpu3 cannot reach proxy.golang.org consistently. Keep direct fallback for
    # modules that have not reached the mainland mirrors yet.
    GOPROXY: "https://goproxy.cn,direct"
    GOSUMDB: "sum.golang.google.cn"
    # Module and build caches live on a persistent host bind mounted at
    # /host-go-cache by the docker runners. Unlike the per-job checkout, the
    # bind survives git clean and concurrent jobs, and unlike the runner-local
    # GitLab cache it keeps working across go.sum bumps (entries are keyed by
    # module@version). -modcacherw keeps the tree cleanable with
    # `go clean -modcache` when a host eventually needs pruning.
    GOMODCACHE: "/host-go-cache/go-mod"
    GOCACHE: "/host-go-cache/go-build"
    GOFLAGS: "-modcacherw"
    # The pinned image ships go1.26.11, exactly what go.mod requires; fail
    # loudly instead of silently downloading a toolchain through GOPROXY.
    GOTOOLCHAIN: "local"
  needs:
    - job: core-ui
      artifacts: true

change-record:
  environment:
    name: change-record
    action: prepare
  extends: .go-core
  stage: change-record
  timeout: 10m
  # The gate compiles only its own package; it must not wait for embedded UI.
  needs: []
  script:
    - ./scripts/check_ci_yaml.sh
    - python3 -B -m unittest discover -s scripts -p test_check_ci_yaml.py
    - CGO_ENABLED=0 go test -timeout 2m ./scripts/changerecord
    - CGO_ENABLED=0 go run ./scripts/changerecord

core-ui:
  # Keep the UI artifact in a short preparation stage so Go checks that compile
  # the embedded web UI can fan out in core.
  stage: core-prepare
  needs:
    - job: change-record
      artifacts: false
  image:
    name: node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  variables:
    # Route npm metadata and tarballs through the mirror while package-lock.json
    # remains authoritative.
    NPM_REGISTRY: "https://registry.npmmirror.com"
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - ui/package-lock.json
      prefix: npm-node22
    paths:
      - .cache/npm/
  script:
    - node scripts/i18n-check.mjs
    - cd ui
    # registry.npmmirror.com occasionally stalls mid-transfer from this runner
    # and resets the connection after 15-20 minutes instead of failing fast,
    # and has hung an install for the whole job timeout. A warm-cache install
    # takes ~10 s, so cut an attempt off at 5 minutes and retry the whole
    # install a few times rather than let one flaky fetch fail the job.
    - |
      for attempt in 1 2 3; do
        timeout 300 npm ci --registry="$NPM_REGISTRY" --prefer-offline --no-audit --no-fund \
          --fetch-retries=5 --fetch-retry-mintimeout=5000 --fetch-retry-maxtimeout=60000 \
          && break
        echo "npm ci attempt $attempt failed" >&2
        if [ "$attempt" = 3 ]; then
          exit 1
        fi
        rm -rf node_modules
        sleep 15
      done
    - npm run lint:i18n
    # Per-file antd ratchet (ui/antd-inventory.json): no file may use more antd
    # than the snapshot records; core-test's architecture check runs without
    # Node, so the check lives here.
    - node ../scripts/ui_antd_inventory.mjs --check
    - npm run build
    # Warns (never fails) when the compressed UI outgrows its budget.
    - (cd .. && ./scripts/check_ui_bundle_size.sh)
  artifacts:
    # Vite writes directly to the directory embedded by the Go server.
    paths:
      - internal/server/webui/dist/
    # Full cloud jobs can queue behind provider resource groups for several
    # hours. Keep the UI long enough for the final hosted job to build its
    # embedded server binary after leaving the queue.
    expire_in: 1 day

docs-build:
  # Build the public documentation independently from the product release
  # jobs. A successful job produces the exact static tree consumed by the
  # existing gpuworks-site refresh timer.
  stage: core-prepare
  needs:
    - job: change-record
      artifacts: false
  image:
    name: golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e
  variables:
    # Nothing in this job reaches a public host: the Hugo binary comes from
    # the rustfs mirror on mirror1 and the oink theme is cloned by
    # docs-site/build.sh from the internal copy of the gpuworks_website
    # repository named by the WEBSITE_REPO project variable (a read-only
    # deploy-token URL).
    # No Go toolchain or module proxy is involved at all.
    HUGO_VERSION: "0.165.0"
    # The runners have no egress to github.com, so Hugo comes from the rustfs
    # mirror on mirror1 (bucket gpuworks-mirror), whose URL is the HUGO_MIRROR
    # project CI/CD variable. A systemd timer there (gpuworks-hugo-mirror)
    # refreshes the mirror daily through a proxy; after bumping HUGO_VERSION,
    # run mirror1's refresh-hugo-mirror.sh with the new version, or wait for
    # the daily run when it is among the newest releases.
    # Set to 1 when the runner image already contains Hugo. In that mode the
    # mirror download is skipped and the job fails clearly if the binary is
    # absent.
    DOCS_OFFLINE: "0"
    HUGO_BIN: ""
  script:
    - |
      if [ "$DOCS_OFFLINE" = "1" ]; then
        test -n "$HUGO_BIN" && test -x "$HUGO_BIN" || {
          echo "DOCS_OFFLINE=1 requires a preinstalled Hugo binary" >&2
          exit 1
        }
      else
        command -v curl >/dev/null
        command -v tar >/dev/null
        test -n "$HUGO_MIRROR" || {
          echo "HUGO_MIRROR (project CI/CD variable) must name the Hugo mirror bucket URL" >&2
          exit 1
        }
        name=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
        base="${HUGO_MIRROR}/hugo"
        curl --fail --location --retry 3 --silent --show-error "$base/$name" -o "$name"
        curl --fail --location --retry 3 --silent --show-error "$base/$name.sha256" -o "$name.sha256"
        sha256sum -c "$name.sha256"
        tar -xzf "$name" -C /usr/local/bin hugo
        HUGO_BIN=/usr/local/bin/hugo
      fi
      HUGO_BIN="$HUGO_BIN" docs-site/build.sh
  artifacts:
    name: "gpuworks-docs-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs-site/public/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - docs-en/**/*
        - docs-site/**/*
        - requirements-e2e.txt
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - docs-en/**/*
        - docs-site/**/*
        - requirements-e2e.txt
        - .gitlab-ci.yml
    - when: never

core-ui-test:
  stage: core
  # One retry for the known timing flakes (async render assertions, e.g. the
  # canvas/filter-chip specs that fail once every couple of days under load);
  # a persistent failure still fails the pipeline. The L4 lanes stopped
  # hard-requiring this job (see .l4-acceptance) but the nightly report still
  # reads pipeline status, so a single flake stays worth absorbing.
  retry: 1
  # The suite is CPU-bound: one run takes ~4 min on the 192-core runner but
  # ~16 on the 20-core ones, and a pipeline lands wherever a slot is free.
  # Three shards (node --test-shard, see TEST_SHARD in ui/package.json) keep
  # the slow-runner case near the fast one instead of on the critical path.
  parallel: 3
  # A shard takes ~4 min on the fast runner and under 25 on the slow ones. A
  # test file that never exits used to hold a slot for the full hour; the
  # suite now bounds each test (--test-timeout in ui/package.json), and this
  # catches anything that still hangs well before the runner default.
  timeout: 30m
  image:
    name: node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  variables:
    NPM_REGISTRY: "https://registry.npmmirror.com"
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - ui/package-lock.json
      prefix: npm-node22
    paths:
      - .cache/npm/
    # This job deliberately starts independently of core-ui, so only consume a
    # cache produced by an earlier pipeline and never race to publish it.
    policy: pull
  needs:
    - job: change-record
      artifacts: false
  script:
    # The macOS serve adapters' tests need only the image's python3. They are
    # not part of the UI suite, so only the first shard runs them.
    - if [ "$CI_NODE_INDEX" = 1 ]; then make test-host-env-adapters && make test-strata-queue-assets; fi
    - cd ui
    # See core-ui: registry.npmmirror.com occasionally stalls mid-transfer and
    # resets the connection instead of failing fast, so retry the install.
    - |
      for attempt in 1 2 3; do
        timeout 300 npm ci --registry="$NPM_REGISTRY" --prefer-offline --no-audit --no-fund \
          --fetch-retries=5 --fetch-retry-mintimeout=5000 --fetch-retry-maxtimeout=60000 \
          && break
        echo "npm ci attempt $attempt failed" >&2
        if [ "$attempt" = 3 ]; then
          exit 1
        fi
        rm -rf node_modules
        sleep 15
      done
    - TEST_SHARD="$CI_NODE_INDEX/$CI_NODE_TOTAL" npm run test:coverage
  artifacts:
    when: always
    # Only the reports: coverage/tmp holds c8's raw V8 dumps (one per test
    # process, node_modules included), which made the archive outgrow the
    # coordinator's upload limit (413) while adding nothing a reader uses.
    paths:
      - ui/coverage/lcov.info
      - ui/coverage/lcov-report/
    expire_in: 14 days

# Walks the console in Chromium against a disposable experience environment
# and fails on what a person would see as broken: covered or overlapping text,
# stretched controls, controls an invisible layer blocks, sideways scrolling,
# console errors (scripts/ui_check_ci.sh, ui/tests/browser/ui-check.mjs). Only
# when the UI changed, and on a merge request only the pages the change
# reaches; shared files and the nightly schedule walk every page. The report
# (screenshots, and the target branch's for the states that look different)
# is attached to the job for a reviewer.
ui-check:
  extends: .go-core
  stage: core
  # Until a prebuilt image replaces the apt step its download alone can take
  # 17–40 minutes; a walk with the comparison takes about 18 s a state.
  timeout: 60m
  retry: 1
  variables:
    NPM_REGISTRY: "https://registry.npmmirror.com"
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
    UI_CHECK_COMPARE: "1"
  cache:
    - key:
        files:
          - ui/package-lock.json
        prefix: npm-node22
      paths:
        - .cache/npm/
      policy: pull
    # The Chromium and font packages: downloading them took about 17 minutes
    # even through the mirror; from the cache apt only unpacks them.
    - key: ui-check-apt-bookworm
      paths:
        - .cache/apt/
      # Keep the download even when the check fails or times out.
      when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ui/**/*
        - scripts/ui_check_ci.sh
        - scripts/ui_antd_inventory.mjs
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    # Chromium and CJK fonts from Debian, through the mirror docs-pdf uses: the
    # runners reach deb.debian.org too slowly. Node 22 (Debian ships 18,
    # Playwright needs 20+) as the pinned, checksummed tarball from the npm
    # mirror the UI jobs already use.
    - sed -i 's|http://deb.debian.org|http://mirrors.aliyun.com|g' /etc/apt/sources.list.d/debian.sources
    - mkdir -p .cache/apt/archives/partial && rm -f /etc/apt/apt.conf.d/docker-clean
    - apt-get -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 update
    - apt-get -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 -o Dir::Cache::Archives="$CI_PROJECT_DIR/.cache/apt/archives" install -y --no-install-recommends chromium fonts-noto-cjk xz-utils >/dev/null
    - export CHROME_PATH=$(command -v chromium)
    - |
      node_tar=node-v22.16.0-linux-x64.tar.xz
      curl -fsSL --retry 3 -o "/tmp/$node_tar" "https://registry.npmmirror.com/-/binary/node/v22.16.0/$node_tar"
      echo "f4cb75bb036f0d0eddf6b79d9596df1aaab9ddccd6a20bf489be5abe9467e84e  /tmp/$node_tar" | sha256sum -c -
      tar -xJf "/tmp/$node_tar" -C /usr/local --strip-components=1
    - (cd ui && npm ci --registry="$NPM_REGISTRY" --prefer-offline --no-audit --no-fund)
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        export UI_CHECK_BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        # A merge request walks both languages at 1024, where layouts break
        # first and English labels run longest; scheduled runs walk 1440 too.
        export UI_CHECK_WIDTHS=1024
      fi
    - ./scripts/ui_check_ci.sh
  artifacts:
    when: always
    paths:
      - ui-check-report/
    expire_in: 14 days

core-test:
  extends: .go-core
  stage: core
  # One retry: environment hiccups on the shared runners (a full disk once
  # failed the build-cache writes) otherwise cascade — every L4 cloud lane
  # hard-needs this job and gets skipped for the night. Persistent failures
  # still fail the pipeline; the retry only heals one-shot flakes.
  retry: 1
  script:
    - ./scripts/check_time_policy.sh
    - ./scripts/check_architecture.sh
    - ./scripts/check_ci_yaml.sh
    - CGO_ENABLED=0 go run ./scripts/artifactsindex
    - make test-e2e-coverage-check
    - test -f internal/server/webui/dist/index.html
    # -timeout: the 10m default is per package binary, and a starved runner
    # (a store package that takes 45 s alone ran 10 min on one) turns it into a
    # panic that names whichever test happened to be running.
    - (cd build/runtime-assets/hygon-vdev-helper && CGO_ENABLED=0 go test -v -timeout 5m ./...)
    - CGO_ENABLED=0 go test -v -timeout 30m -coverprofile=coverage-core.out ./...
    # Build-tag suites are reported separately; compile them here so a
    # refactor cannot silently break an opt-in lane while core remains green.
    - make check-tagged-build
  artifacts:
    when: always
    paths:
      - coverage-core.out
    expire_in: 14 days

core-vet:
  extends: .go-core
  stage: core
  script:
    - CGO_ENABLED=0 go vet ./...

core-lint:
  extends: .go-core
  stage: core
  script:
    - make lint

# Strict L2 contains a real Docker adoption/recovery case and L3 is entirely a
# Docker gate. The ordinary project runners use an unprivileged Docker executor
# with no daemon socket, so both jobs are pinned to the project's tag-only
# shell runners (mirror1/gpu3/gpu2, tag gpuworks-l3). A per-job DinD container
# isolates every child container and gives cancellation an exact cleanup
# target instead of touching unrelated host workloads. There is no
# resource_group: a project-wide one serialized every pipeline's L2/L3 behind a
# single slot and left the tagged runners idle. Per-host concurrency is capped
# instead by each shell runner's `limit` in its config.toml. Same-host
# concurrency is safe: each job gets its own executor slot (separate checkout)
# and its own DinD, and the shared host image cache is written via
# tmp-file-plus-atomic-rename below.
.docker-core:
  stage: core
  tags:
    - gpuworks-l3
  timeout: 45m
  needs:
    - job: core-ui
      artifacts: true
  variables:
    DOCKER_DIND_IMAGE: "docker:29-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07"
    DOCKER_GO_IMAGE: "golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e"
    # Docker Hub is intermittently unreachable from the CI runner. Keep the
    # L3 fixtures reproducible while using a public mainland mirror for their
    # busybox/Python/Alpine base images. The registry image keeps the quay
    # name test/l3 hardcodes; seeding it below avoids pulling it in-test.
    GPUWORKS_L3_RUNTIME_BASE_IMAGE: "docker.m.daocloud.io/library/python:3.12"
    GPUWORKS_L3_SHELL_BASE_IMAGE: "docker.m.daocloud.io/library/busybox:1.36"
    GPUWORKS_L3_NO_PYTHON_IMAGE: "docker.m.daocloud.io/library/alpine:3.20"
    GPUWORKS_L3_REGISTRY_IMAGE: "quay.io/libpod/registry:2.8.2"
  script:
    # Go deliberately makes module-cache directories read-only. Keep those
    # files outside the reusable Git checkout so the next job using this
    # executor slot can clean the worktree, and use -modcacherw for future
    # cache updates.
    - export DOCKER_HOST_CACHE="$HOME/.cache/gpuworks-ci/$CI_PROJECT_ID"
    - mkdir -p "$DOCKER_HOST_CACHE/go-mod" "$DOCKER_HOST_CACHE/go-build" "$DOCKER_HOST_CACHE/images" "$CI_PROJECT_DIR/.cache/home" "$CI_PROJECT_DIR/.tmp"
    # Share a short job-owned Unix endpoint with the non-root Go container.
    # Container PTYs require a local socket, and exec pins this exact daemon.
    - export GPUWORKS_CI_SOCKET_DIR="$CI_PROJECT_DIR/.tmp/gpuworks-e2e-$CI_JOB_ID"
    - mkdir -p "$GPUWORKS_CI_SOCKET_DIR"
    # A cancelled or killed job may skip after_script and leave its DinD
    # running; each DinD also owns a ~1.6 GB anonymous /var/lib/docker volume.
    # Reap labelled containers (and their volumes) older than 2h, well past
    # this template's 45m timeout, so a concurrent job is never touched.
    - |
      now=$(date +%s)
      for c in $(docker ps -aq --filter label=gpuworks-ci-docker-core); do
        created=$(docker inspect -f '{{.Created}}' "$c" 2>/dev/null) || continue
        if [ $((now - $(date -d "$created" +%s))) -gt 7200 ]; then
          echo "reaping leaked CI container $c (created $created)"
          docker rm -f -v "$c" >/dev/null 2>&1 || true
        fi
      done
    # The host agent reclaims gpuworks-* names as managed workloads.
    # CI infrastructure must live outside that container namespace.
    - >
      docker run -d --privileged
      --name "ci-gpuworks-docker-core-dind-$CI_JOB_ID"
      --label gpuworks-ci-docker-core
      -e DOCKER_TLS_CERTDIR=
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -v "$GPUWORKS_CI_SOCKET_DIR:/run/gpuworks-e2e"
      -v "$DOCKER_HOST_CACHE/images:$DOCKER_HOST_CACHE/images"
      "$DOCKER_DIND_IMAGE"
      --host=tcp://0.0.0.0:2375
      --host=unix:///var/run/docker.sock
      --host=unix:///run/gpuworks-e2e/docker.sock
    - |
      ready=0
      for attempt in $(seq 1 60); do
        if docker exec "ci-gpuworks-docker-core-dind-$CI_JOB_ID" docker --host unix:///run/gpuworks-e2e/docker.sock info >/dev/null 2>&1; then
          ready=1
          break
        fi
        sleep 1
      done
      if [ "$ready" != 1 ]; then
        docker logs "ci-gpuworks-docker-core-dind-$CI_JOB_ID" || true
        echo "isolated Docker test daemon did not become ready" >&2
        exit 1
      fi
      docker exec "ci-gpuworks-docker-core-dind-$CI_JOB_ID" chown "$(id -u):$(id -g)" /run/gpuworks-e2e/docker.sock
    # Every job starts a brand-new, empty DinD daemon, so without this it
    # re-pulls the L3 fixture base images from the network on every run. Seed
    # the fresh daemon from a host-side tar cache first; only pull (and then
    # refresh the cache) on a miss. A miss is pulled by the host daemon first:
    # the per-job DinD has none of the host's proxy or registry-mirror settings,
    # and some runners (ppu1) cannot reach Docker Hub or quay directly. The
    # tmp-file-plus-rename keeps a concurrent writer (e.g. a parallel core-l2
    # run) from exposing a half-written tar.
    - |
      dind="ci-gpuworks-docker-core-dind-$CI_JOB_ID"
      for image in "$GPUWORKS_L3_SHELL_BASE_IMAGE" "$GPUWORKS_L3_RUNTIME_BASE_IMAGE" "$GPUWORKS_L3_NO_PYTHON_IMAGE" "$GPUWORKS_L3_REGISTRY_IMAGE"; do
        [ -n "$image" ] || continue
        cache_file="$DOCKER_HOST_CACHE/images/$(echo "$image" | tr -c 'A-Za-z0-9._-' '_').tar"
        if [ -f "$cache_file" ]; then
          echo "docker image cache hit: $image"
          docker exec "$dind" docker load -i "$cache_file"
        elif docker image inspect "$image" >/dev/null 2>&1; then
          echo "host docker image hit: $image"
          tmp_file="$cache_file.$CI_JOB_ID.tmp"
          docker save -o "$tmp_file" "$image"
          docker exec "$dind" docker load -i "$tmp_file"
          mv -n "$tmp_file" "$cache_file" 2>/dev/null || rm -f "$tmp_file"
        elif [ "$image" = "docker.m.daocloud.io/library/python:3.12" ] && docker image inspect python:3.12 >/dev/null 2>&1; then
          # mirror1 keeps the full Python fixture preloaded under the short
          # Docker Hub name. Import it without contacting either registry,
          # then add the configured mirror reference used by the tests.
          echo "host docker image alias hit: python:3.12 -> $image"
          tmp_file="$cache_file.$CI_JOB_ID.tmp"
          docker save -o "$tmp_file" python:3.12
          docker exec "$dind" docker load -i "$tmp_file"
          docker exec "$dind" docker tag python:3.12 "$image"
          docker exec "$dind" docker save -o "$tmp_file" "$image"
          mv -n "$tmp_file" "$cache_file" 2>/dev/null || rm -f "$tmp_file"
        elif docker pull "$image"; then
          echo "docker image cache miss: $image (pulled by host daemon)"
          tmp_file="$cache_file.$CI_JOB_ID.tmp"
          docker save -o "$tmp_file" "$image"
          docker exec "$dind" docker load -i "$tmp_file"
          mv -n "$tmp_file" "$cache_file" 2>/dev/null || rm -f "$tmp_file"
        else
          echo "docker image cache miss: $image (pulling in DinD)"
          docker exec "$dind" docker pull "$image"
          tmp_file="$cache_file.$CI_JOB_ID.tmp"
          docker exec "$dind" docker save -o "$tmp_file" "$image"
          mv -n "$tmp_file" "$cache_file" 2>/dev/null || rm -f "$tmp_file"
        fi
      done
    - >
      docker run --rm
      --name "ci-gpuworks-docker-core-go-$CI_JOB_ID"
      --label gpuworks-ci-docker-core
      --network "container:ci-gpuworks-docker-core-dind-$CI_JOB_ID"
      --user "$(id -u):$(id -g)"
      -v /usr/bin/docker:/usr/bin/docker:ro
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -v "$GPUWORKS_CI_SOCKET_DIR:/run/gpuworks-e2e"
      --tmpfs /run/gpuworks-full-disk:rw,size=64m,mode=1777
      -e GPUWORKS_TEST_FULL_DISK_TMPFS=/run/gpuworks-full-disk
      -v "$DOCKER_HOST_CACHE/go-mod:/go-cache/mod"
      -v "$DOCKER_HOST_CACHE/go-build:/go-cache/build"
      -w "$CI_PROJECT_DIR"
      -e DOCKER_HOST=unix:///run/gpuworks-e2e/docker.sock
      -e HOME="$CI_PROJECT_DIR/.cache/home"
      -e TMPDIR="$CI_PROJECT_DIR/.tmp"
      -e GOMODCACHE=/go-cache/mod
      -e GOCACHE=/go-cache/build
      -e GOFLAGS=-modcacherw
      -e GOPROXY=https://goproxy.cn,direct
      -e GOSUMDB=sum.golang.google.cn
      -e GOTOOLCHAIN=local
      -e GPUWORKS_TEST_STRICT=1
      -e CI_NODE_INDEX
      -e CI_NODE_TOTAL
      -e GPUWORKS_TESTENV_FAILURE_LOG_DIR
      -e GPUWORKS_L3_RUNTIME_BASE_IMAGE="$GPUWORKS_L3_RUNTIME_BASE_IMAGE"
      -e GPUWORKS_L3_SHELL_BASE_IMAGE="$GPUWORKS_L3_SHELL_BASE_IMAGE"
      -e GPUWORKS_L3_NO_PYTHON_IMAGE="$GPUWORKS_L3_NO_PYTHON_IMAGE"
      "$DOCKER_GO_IMAGE"
      sh -c "$DOCKER_TEST_COMMAND"
  after_script:
    # On failure keep what is needed to tell a wedged inner dockerd (docker run
    # never creating the container, stop/rm/inspect all killed by their
    # timeouts) from a test bug, as files uploaded with the job (artifacts
    # below, failure-evidence/): the DinD daemon's own timestamped log, its
    # containers and their last lines, the host load/pressure at the end of the
    # job, and next to them the server and agent logs of each failed case
    # (GPUWORKS_TESTENV_FAILURE_LOG_DIR, 1 MiB tail per case). Every piece is
    # tailed and the whole is capped at 10 MiB; nothing is kept for a passing
    # job. Read-only and best effort, so it cannot change the result.
    - |
      if [ "$CI_JOB_STATUS" = failed ]; then
        ev="$CI_PROJECT_DIR/failure-evidence"; dind="ci-gpuworks-docker-core-dind-$CI_JOB_ID"
        mkdir -p "$ev/containers"
        { echo "loadavg: $(cat /proc/loadavg 2>/dev/null)"
          for p in cpu io memory; do echo "pressure/$p: $(cat /proc/pressure/$p 2>/dev/null | tr '\n' ' ')"; done; } > "$ev/host.txt"
        cat "$ev/host.txt"
        timeout 60 docker logs --timestamps --tail 5000 "$dind" > "$ev/dockerd.log" 2>&1 || true
        timeout 30 docker exec "$dind" docker info > "$ev/docker-info.txt" 2>&1 || true
        timeout 30 docker exec "$dind" docker ps -a --no-trunc > "$ev/docker-ps.txt" 2>&1 || true
        for c in $(timeout 30 docker exec "$dind" docker ps -aq 2>/dev/null | head -30); do
          timeout 30 docker exec "$dind" docker logs --timestamps --tail 200 "$c" > "$ev/containers/$c.log" 2>&1 || true
        done
        # Over the cap, drop the largest per-case logs first: the daemon side is
        # what the job trace cannot show at all.
        while [ "$(du -sk "$ev" | cut -f1)" -gt 10240 ]; do
          big=$(find "$ev" -type f -name '*.log' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          [ -n "$big" ] || break
          echo "failure-evidence over 10 MiB: dropping $big"; rm -f "$big"
        done
        echo "failure evidence kept: $(du -sh "$ev" | cut -f1) in failure-evidence/ (job artifacts)"
      fi
    # -v: the DinD image declares /var/lib/docker as an anonymous volume;
    # without it every job leaked ~1.6 GB and filled the runner's root disk.
    - docker rm -f -v "ci-gpuworks-docker-core-go-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker rm -f -v "ci-gpuworks-docker-core-dind-$CI_JOB_ID" >/dev/null 2>&1 || true
    # Engine containers write root-owned files into TMPDIR (.tmp, kept inside
    # the workspace for DinD-visible bind mounts); a crashed-container test
    # cannot clean them itself. Prune as root via a container so the next
    # job's checkout stays healthy. Guarded so docker never auto-create a
    # root-owned .tmp in a fresh workspace.
    - if [ -d "$CI_PROJECT_DIR/.tmp" ]; then docker run --rm -v "$CI_PROJECT_DIR/.tmp:/t" "$DOCKER_GO_IMAGE" sh -c "rm -rf /t/* /t/.[!.]*" || true; fi

core-l2:
  extends: .docker-core
  # One retry for the known timing flakes: these suites fail roughly once a
  # night across the runner pool on different cases (docker adopt waits,
  # fixture download races), and a single flake failing the pipeline blocks
  # the nightly report even though the L4 lanes no longer depend on this job.
  # A persistent failure still fails: only one retry.
  retry: 1
  # The suite is one package whose ~70 cases run one after another for
  # 14-23 min. Three round-robin shards by test name (L2_SHARD, see
  # scripts/go_test_shard.sh) each carry about a third; -v puts every case's
  # duration in the trace for rebalancing.
  parallel: 3
  variables:
    DOCKER_TEST_COMMAND: "make test-l2 GO_TEST_FLAGS=-v L2_SHARD=$CI_NODE_INDEX/$CI_NODE_TOTAL COVERPROFILE=coverage-l2.out"
  artifacts:
    when: always
    paths:
      - coverage-l2.out
      - failure-evidence/
    expire_in: 14 days

core-l3:
  extends: .docker-core
  # Same rationale as core-l2: single retry for container-timing flakes.
  retry: 1
  variables:
    DOCKER_TEST_COMMAND: "make test-l3 GO_TEST_FLAGS=-v COVERPROFILE=coverage-l3.out"
    # In-process server and agent logs of each failed case (see .docker-core).
    GPUWORKS_TESTENV_FAILURE_LOG_DIR: "$CI_PROJECT_DIR/failure-evidence/cases"
  artifacts:
    when: always
    paths:
      - coverage-l3.out
      - failure-evidence/
    expire_in: 14 days

# Control-plane scale cases, all gated by FLEET_REDEPLOY_CHURN=1 from a
# nightly schedule (or an operator via web/api), never on merge requests: the
# redeploy churn (real server binary as one process, 1000 real agents in a
# second one, half of them redeploying) and the log-center read budget case
# (every instance streaming at the target aggregate ~2000 lines/s while half
# the fleet redeploys; asserts the p95 budgets from
# artifacts/archive/2026-09-19-log-center/plan.md), plus a server-origin
# saturation evaluation under the server's RSS budget. All are measurements of
# a loaded host and need no Docker and no GPU. Strict mode turns a too-low descriptor
# limit into a failure instead of a skip that would read as green.
l2-fleet-redeploy-churn:
  extends: .go-core
  stage: core
  timeout: 75m
  variables:
    GPUWORKS_TEST_STRICT: "1"
    GPUWORKS_FLEET_PROCESS_LOGS: "1"
    GPUWORKS_FLEET_WORK_DIR: "$CI_PROJECT_DIR/.tmp/fleet"
  script:
    - test -f internal/server/webui/dist/index.html
    - mkdir -p "$GPUWORKS_FLEET_WORK_DIR"
    - ulimit -n 65536 || true
    # No pipe into tee: without pipefail the job would report tee's status.
    # Each case logs to its own file so a log-budget failure keeps the churn
    # evidence intact; the job fails if either case fails.
    - status=0; make test-fleet-perf-processes > fleet-redeploy-churn.log 2>&1 || status=$?
    - cat fleet-redeploy-churn.log
    - make test-fleet-log-scale-processes > fleet-log-scale.log 2>&1 || status=$?
    - cat fleet-log-scale.log
    - make test-fleet-benchmark-processes > fleet-benchmark.log 2>&1 || status=$?
    - cat fleet-benchmark.log
    - exit "$status"
  # The per-process logs are 40 files and the upload failed with 413 Request
  # Entity Too Large even on green runs, so they ship as one compressed
  # archive. after_script runs whatever the script's outcome and must not turn
  # a missing log directory into a failure.
  after_script:
    - |
      if [ -d "$GPUWORKS_FLEET_WORK_DIR" ] && [ -n "$(find "$GPUWORKS_FLEET_WORK_DIR" -name '*.log' -print -quit)" ]; then
        find "$GPUWORKS_FLEET_WORK_DIR" -name '*.log' -print0 | tar --null -T - -czf fleet-process-logs.tar.gz || true
        rm -rf "$GPUWORKS_FLEET_WORK_DIR"
      fi
      gzip -f fleet-redeploy-churn.log fleet-log-scale.log fleet-benchmark.log 2>/dev/null || true
      true
  artifacts:
    when: always
    paths:
      - fleet-redeploy-churn.log.gz
      - fleet-log-scale.log.gz
      - fleet-benchmark.log.gz
      - fleet-process-logs.tar.gz
    expire_in: 14 days
  rules:
    - if: '$FLEET_REDEPLOY_CHURN == "1" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

# Provider API/SSH contracts are tagged L4 code but use only faithful local
# fixtures. Run them as an automatic hermetic gate without cloud credentials or
# cleanup calls; real CompShare allocation remains in explicit cloud jobs.
core-compshare-offline-contracts:
  extends: .go-core
  stage: core
  script:
    - make test-l4-compshare-offline-contracts GO_TEST_FLAGS='-coverpkg=./internal/...,./pkg/... -coverprofile=coverage-compshare-contracts.out'
  artifacts:
    when: always
    paths:
      - coverage-compshare-contracts.out
    expire_in: 14 days

release-docs-pdf:
  extends: .go-core
  stage: release
  timeout: 20m
  needs:
    - job: docs-build
      artifacts: true
  script:
    # Reuse the existing Playwright requirement; browsers are build tools only.
    - sed -i 's|http://deb.debian.org|http://mirrors.aliyun.com|g' /etc/apt/sources.list.d/debian.sources
    - apt-get -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 update
    - apt-get -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2 install -y --no-install-recommends chromium fonts-noto-cjk fontconfig python3-venv poppler-utils
    - python3 -m venv .tmp/docs-pdf-venv
    # Avoid slow public-PyPI wheel downloads and reuse the runner's tool cache.
    - |
      .tmp/docs-pdf-venv/bin/pip install --disable-pip-version-check \
        --index-url "${GPUWORKS_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}" \
        --timeout 30 --retries 2 --cache-dir /host-go-cache/tools/pip \
        -r requirements-e2e.txt
    - export CHROME_PATH=/usr/bin/chromium
    - .tmp/docs-pdf-venv/bin/python docs-site/pdf_browser_checks.py
    - .tmp/docs-pdf-venv/bin/python docs-site/export_pdf.py --version "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  artifacts:
    name: "gpuworks-docs-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/docs/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

# One archive per job keeps each below GitLab's per-job artifact size limit
# (an archive is ~53 MB since the server embeds a macOS agent too; two per job
# no longer fit). The release website publishes a pipeline only after every
# job succeeds; gpuworks-dist assembles the archives themselves and trusts no
# job's release.json or SHA256SUMS. Failed or running pipelines never replace
# a build.
.release-build:
  extends: .go-core
  stage: release
  # Same gate policy as .l4-acceptance: only the fast deterministic gates.
  # core-l2/l3/ui-test flakes must not also kill the nightly packages, as
  # they did on 2026-09-30 and 2026-10-01.
  needs:
    - job: core-ui
      artifacts: true
    - job: core-test
    - job: core-vet
    - job: core-lint
    - job: core-compshare-offline-contracts
  script:
    # The zstd CLI packs the embedded agents ~10% smaller than the Go
    # encoder make falls back to; a mirror hiccup only costs that, not the build.
    # The runners reach deb.debian.org so poorly that apt alone took 40 s to
    # 9 min per job (and usually failed anyway) against a ~15 s build. So the
    # .deb is kept in the persistent host cache, a miss goes through the Aliyun
    # mirror, and short timeouts cap a mirror outage at seconds. The pinned
    # image already ships libzstd/liblz4/liblzma, so the deb installs alone.
    - |
      ZSTD_DEBS=/host-go-cache/tools/apt-zstd
      if ! ls "$ZSTD_DEBS"/zstd_*.deb >/dev/null 2>&1; then
        sed -i 's|http://deb.debian.org|http://mirrors.aliyun.com|g' /etc/apt/sources.list.d/debian.sources
        apt_opts="-qq -o Acquire::http::Timeout=10 -o Acquire::Retries=1"
        if apt-get $apt_opts update && apt-get $apt_opts install -y --download-only --no-install-recommends zstd >/dev/null; then
          mkdir -p "$ZSTD_DEBS" && tmp=$(mktemp -d "$ZSTD_DEBS/.tmp.XXXXXX") \
            && cp /var/cache/apt/archives/zstd_*.deb "$tmp/" \
            && mv -f "$tmp"/zstd_*.deb "$ZSTD_DEBS/"; rm -rf "$tmp"
        fi
      fi
      dpkg -i "$ZSTD_DEBS"/zstd_*.deb >/dev/null 2>&1 || dpkg -i /var/cache/apt/archives/zstd_*.deb >/dev/null 2>&1 || echo "zstd unavailable; embedding the agents with the Go encoder"
    - make release-packages
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  # Keep these rules identical in .release-build and release-publish: the
  # default branch builds the nightly channel under its short commit, a
  # release tag builds the release channel under the tag (ADR 0040).
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_SHORT_SHA"
        GPUWORKS_RELEASE_CHANNEL: "nightly"
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_TAG"
        GPUWORKS_RELEASE_CHANNEL: "release"
    - when: never

release-build-linux-amd64:
  extends: .release-build
  variables:
    GPUWORKS_RELEASE_OSES: "linux"
    GPUWORKS_RELEASE_ARCHES: "amd64"
  artifacts:
    name: "gpuworks-$GPUWORKS_RELEASE_ID-linux-amd64"

release-build-linux-arm64:
  extends: .release-build
  variables:
    GPUWORKS_RELEASE_OSES: "linux"
    GPUWORKS_RELEASE_ARCHES: "arm64"
  artifacts:
    name: "gpuworks-$GPUWORKS_RELEASE_ID-linux-arm64"

release-build-macos-amd64:
  extends: .release-build
  variables:
    GPUWORKS_RELEASE_OSES: "darwin"
    GPUWORKS_RELEASE_ARCHES: "amd64"
  artifacts:
    name: "gpuworks-$GPUWORKS_RELEASE_ID-darwin-amd64"

release-build-macos-arm64:
  extends: .release-build
  variables:
    GPUWORKS_RELEASE_OSES: "darwin"
    GPUWORKS_RELEASE_ARCHES: "arm64"
  artifacts:
    name: "gpuworks-$GPUWORKS_RELEASE_ID-darwin-arm64"

# Publish each default-branch build (nightly) and release tag (release) and the
# catalogs embedded in it to the distribution sources (ADR 0040): Aliyun OSS,
# Huawei OBS and Cloudflare R2. Both build jobs' dist/ artifacts are merged
# here; gpuworks-dist reads the archives themselves, not either job's
# release.json. Credentials and the index signing key are protected, masked
# project variables, so the job only runs on protected refs: master and the
# protected v* tags. resource_group keeps two publishes from interleaving,
# and the script skips a pipeline older than what the sources already serve.
# rclone is built once per version into the persistent host cache. It sits in
# a stage of its own because GitLab 14.0 only lets needs name jobs of earlier
# stages.
release-publish:
  extends: .go-core
  stage: publish
  needs:
    - job: release-build-linux-amd64
      artifacts: true
    - job: release-build-linux-arm64
      artifacts: true
    - job: release-build-macos-amd64
      artifacts: true
    - job: release-build-macos-arm64
      artifacts: true
    - job: release-docs-pdf
      artifacts: true
      optional: true
  resource_group: distribution
  interruptible: false
  variables:
    # Not RCLONE_VERSION: rclone reads every RCLONE_<FLAG> variable as that
    # flag, and took this one for --version (job 217655).
    GPUWORKS_RCLONE_VERSION: "v1.75.2"
  script:
    - export RCLONE="/host-go-cache/tools/rclone-$GPUWORKS_RCLONE_VERSION/rclone"
    - test -x "$RCLONE" || GOBIN="$(dirname "$RCLONE")" go install "github.com/rclone/rclone@$GPUWORKS_RCLONE_VERSION"
    - ./scripts/publish_dist.sh "$GPUWORKS_RELEASE_CHANNEL" dist
  # Keep these rules identical in .release-build and release-publish: the
  # default branch builds the nightly channel under its short commit, a
  # release tag builds the release channel under the tag (ADR 0040).
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_SHORT_SHA"
        GPUWORKS_RELEASE_CHANNEL: "nightly"
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_TAG"
        GPUWORKS_RELEASE_CHANNEL: "release"
    - when: never

# Push the agent image Kubernetes clusters run (build/agent-image, ADR 0052)
# under its runtime revision (build/agent-image/REVISION), the tag a cluster
# entry's manifest names, and under <revision>-<version>. The agent in the
# image only seeds a node; the agents then take and upgrade to the server's
# own binary, so a nightly moving the revision tag does no harm. GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG is a
# protected file variable holding a docker config.json with the registries'
# credentials; without it the job fails rather than pretend it published.
# The shell runner has docker but no Go: make runs in the pinned Go image with
# the host's docker CLI and socket, and buildx runs from the docker CLI image
# (scripts/agent_image.sh), so the host needs no buildx plugin.
release-agent-image:
  stage: publish
  tags:
    - gpuworks-l3
  needs:
    - job: release-build-linux-amd64
    - job: release-build-linux-arm64
  resource_group: agent-image
  interruptible: false
  timeout: 30m
  variables:
    DOCKER_GO_IMAGE: "golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e"
    GPUWORKS_AGENT_IMAGE_REPOS: "docker.io/gpuworks/gpuworks-agent quay.io/gpuworks/gpuworks-agent swr.cn-southwest-2.myhuaweicloud.com/gpuworks/gpuworks-agent"
    # The runners time out on github.com; the script checks nerdctl's sha256
    # whichever of these serves it.
    NERDCTL_URL_BASE: "https://gh-proxy.com/https://github.com/containerd/nerdctl/releases/download https://ghfast.top/https://github.com/containerd/nerdctl/releases/download https://github.com/containerd/nerdctl/releases/download"
  script:
    # Mounted at its own host path: the docker CLI image that pushes is started
    # by the host daemon, which resolves bind mounts on the host.
    - |
      if [ ! -s "${GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG:-}" ]; then
        echo "GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG is not set, so there are no registry credentials to push the agent image with" >&2
        exit 1
      fi
    - export TOOL_CACHE="$HOME/.cache/gpuworks-ci/$CI_PROJECT_ID"
    - mkdir -p "$TOOL_CACHE/go-mod" "$TOOL_CACHE/go-build" "$TOOL_CACHE/tools" "$CI_PROJECT_DIR/.tmp"
    - >
      docker run --rm
      --name "ci-gpuworks-agent-image-$CI_JOB_ID"
      --network host
      --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)"
      -v /usr/bin/docker:/usr/bin/docker:ro
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -v "$TOOL_CACHE/go-mod:/go-cache/mod"
      -v "$TOOL_CACHE/go-build:/go-cache/build"
      -v "$TOOL_CACHE/tools:/go-cache/tools"
      -v "$GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG:$GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG:ro"
      -w "$CI_PROJECT_DIR"
      -e HOME="$CI_PROJECT_DIR/.tmp"
      -e TMPDIR="$CI_PROJECT_DIR/.tmp"
      -e GOMODCACHE=/go-cache/mod -e GOCACHE=/go-cache/build -e GOFLAGS=-modcacherw
      -e GOPROXY=https://goproxy.cn,direct -e GOSUMDB=sum.golang.google.cn -e GOTOOLCHAIN=local
      -e GPUWORKS_TOOL_CACHE=/go-cache/tools
      -e NERDCTL_URL_BASE
      -e GPUWORKS_AGENT_IMAGE_REPOS
      -e GPUWORKS_AGENT_IMAGE_DOCKER_CONFIG
      -e GPUWORKS_DOCKER_CLI_IMAGE=docker.m.daocloud.io/library/docker:29-cli
      -e GPUWORKS_BUILDKIT_IMAGE=docker.m.daocloud.io/moby/buildkit:v0.25.2
      "$DOCKER_GO_IMAGE"
      make agent-image-publish VERSION="$GPUWORKS_RELEASE_ID" COMMIT="$CI_COMMIT_SHA"
  # Keep these rules identical in .release-build, release-publish and
  # release-agent-image (ADR 0040).
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_SHORT_SHA"
        GPUWORKS_RELEASE_CHANNEL: "nightly"
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        GPUWORKS_RELEASE_ID: "$CI_COMMIT_TAG"
        GPUWORKS_RELEASE_CHANNEL: "release"
    - when: never

# Every job below that has an `environment:` uses `action: prepare`. This
# project has "Skip outdated deployment jobs" (ci_forward_deployment_enabled)
# on: when a deployment starts running, GitLab drops every older running
# deployment of the same environment, which fails that job mid-run with a
# trace that just stops ("403 Job is not running"). Nightly master job 261712
# (l4-aliyun-provisioning-matrix) was killed that way the moment an MR
# pipeline's manual run of the same job started. `action: prepare` keeps the
# environment-scoped CI variables (cloud-test/<provider>/*, the credentials)
# but creates no deployment, so there is nothing to supersede; the older-job
# drop is driven by deployments only. GitLab 14.0 has only `prepare` (`verify`
# and `access` came later). Mutual exclusion is the resource_group's job, not
# the environment's, so a new L4 job needs `action: prepare` too.
.l4-cloud:
  image:
    name: golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e
  interruptible: false
  retry: 0
  needs:
    - job: core-ui
      artifacts: true
  variables:
    GOPROXY: "https://goproxy.cn,direct"
    GOSUMDB: "sum.golang.google.cn"
    # Persistent host bind, same as .go-core: cloud jobs share one warm
    # module/build cache per runner host across pipelines and go.sum bumps.
    GOMODCACHE: "/host-go-cache/go-mod"
    GOCACHE: "/host-go-cache/go-build"
    GOFLAGS: "-modcacherw"
    GOTOOLCHAIN: "local"
    # Every cloud job gets a distinct immutable owner. Cleanup requires an
    # exact resource-name match, so jobs and external test agents stay isolated.
    GPUWORKS_CLOUD_TEST_RUN_ID: "gitlab-$CI_PROJECT_ID-$CI_JOB_ID"
    # Tagged L4 execution has its own profile instead of disappearing from the
    # untagged core report. Each cloud job runs one authoritative suite.
    GO_TEST_FLAGS: "-coverpkg=./internal/...,./pkg/... -coverprofile=coverage-cloud.out"
  before_script:
    - make test-l4-cleanup-leaked
  after_script:
    - make test-l4-cleanup-leaked
  artifacts:
    when: always
    paths:
      - coverage-cloud.out
    expire_in: 14 days

.l4-acceptance:
  extends: .l4-cloud
  stage: l4-acceptance
  timeout: 120m
  # A needs graph otherwise lets these costly jobs bypass stage ordering as
  # soon as core-ui finishes. The remaining gates are the fast, deterministic
  # ones (unit tests, vet, offline contracts) plus the core-ui artifacts the
  # jobs embed. core-l2/l3/ui-test are deliberately NOT needed: they flake
  # often enough that hard-requiring them skipped the whole scheduled cloud
  # matrix for full nights (2026-09-30, 2026-10-01), losing cloud coverage to
  # a local-timing failure. This GitLab (14.0.12) cannot express a conditional
  # or failure-tolerant need (needs:optional only excuses absent jobs —
  # verified with a live probe pipeline, 2026-09-25), so the weaker
  # gate is expressed by dropping the need entirely; nightly cloud spend is
  # still protected by core-test, which fails on any real build breakage.
  needs:
    - job: core-ui
      artifacts: true
    - job: core-test
    - job: core-vet
    - job: core-lint
    - job: core-compshare-offline-contracts
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never

# Public download verification is isolated from the stable provider smoke and
# only runs when an operator/schedule explicitly enables the low-rate lane.
l4-runpod-huggingface-public-download:
# The runner egress to RunPod/HuggingFace sags during business hours (TLS
# handshake timeouts against api.runpod.io were part of the 2026-09-20
# incident); routing the provider HTTPS through the internal proxy measured
# 20-50% faster cold connections. The provider HTTP client uses the default
# transport, so it honors these without code changes; loopback and the
# domestic module/GitLab hosts stay direct.
  variables:
    HTTPS_PROXY: "http://zstack.one:7890"
    HTTP_PROXY: "http://zstack.one:7890"
    NO_PROXY: "localhost,127.0.0.1,::1,dev.zstack.io,goproxy.cn"
    # The HTTP proxy refuses CONNECT to port 22, but the SOCKS listener on
    # 7891 tunnels arbitrary TCP (verified from the runners), so the SSH
    # agent upload rides it: the in-process test server passes this into its ssh_proxy setting.
    GPUWORKS_SSH_PROXY: "socks5://zstack.one:7891"
  extends: .l4-acceptance
  timeout: 30m
  environment:
    # Keep provider credentials scoped under cloud-test/runpod/* while making
    # the low-frequency download lane distinguishable in GitLab environments.
    name: cloud-test/runpod/download-huggingface
    action: prepare
  script:
    - make test-l4-runpod-huggingface-public-download
  rules:
    - if: '$CLOUD_DOWNLOAD == "1" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never

l4-runpod-vllm-sglang-lifecycle:
# The runner egress to RunPod/HuggingFace sags during business hours (TLS
# handshake timeouts against api.runpod.io were part of the 2026-09-20
# incident); routing the provider HTTPS through the internal proxy measured
# 20-50% faster cold connections. The provider HTTP client uses the default
# transport, so it honors these without code changes; loopback and the
# domestic module/GitLab hosts stay direct.
  variables:
    HTTPS_PROXY: "http://zstack.one:7890"
    HTTP_PROXY: "http://zstack.one:7890"
    NO_PROXY: "localhost,127.0.0.1,::1,dev.zstack.io,goproxy.cn"
    # The HTTP proxy refuses CONNECT to port 22, but the SOCKS listener on
    # 7891 tunnels arbitrary TCP (verified from the runners), so the SSH
    # agent upload rides it: the in-process test server passes this into its ssh_proxy setting.
    GPUWORKS_SSH_PROXY: "socks5://zstack.one:7891"
  extends: .l4-acceptance
  environment:
    name: cloud-test/runpod/full
    action: prepare
  script:
    - make test-l4-runpod-vllm-sglang-lifecycle

l4-autodl-node-onboarding:
  extends: .l4-acceptance
  # go test -timeout is 85m: up to 30m (AUTODL_STOCK_WAIT) waiting out a
  # sold-out Pro spec list, plus the 55m a rented node needs.
  timeout: 95m
  environment:
    name: cloud-test/autodl/full
    action: prepare
  script:
    - make test-l4-autodl-node-onboarding

# Nightly Gitee coverage is capability-only and may run concurrently with other
# providers. Gitee VMs cannot expose device-share, so real memory isolation is
# covered by l4-ascend-pool-partition-inference; see the dated limitation artifact.
l4-gitee-ascend-partition-capability:
  extends: .l4-acceptance
  # go test -timeout is 55m, of which up to 30m (GITEE_STOCK_WAIT) is spent
  # retrying while every profile reports no available host; the rest of the
  # 140m is runner queueing and job setup headroom as before.
  timeout: 140m
  environment:
    name: cloud-test/gitee-capability
    action: prepare
  script:
    # Nightly capability-only check: no business image, model download, or chat.
    - make test-l4-gitee-ascend-partition-capability

# Full Gitee deployment/chat is intentionally opt-in. The capability job above
# remains the nightly signal; this long, network-heavy acceptance is only
# started explicitly from a web/API pipeline or an MR manual action.
l4-gitee-ascend-deploy-chat:
  extends: .l4-acceptance
  timeout: 135m
  environment:
    name: cloud-test/gitee-deploy-chat
    action: prepare
  script:
    - make test-l4-gitee-ascend-deploy-chat
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never

# The self-owned Ascend pool uses current source in an isolated state directory
# and reuses cached models/images. Host addresses, SSH paths and proxy settings
# are environment-scoped GitLab variables, not repository configuration.
l4-ascend-pool-partition-inference:
  stage: l4-acceptance
  # The test starts temporary agents and containers on the shared Ascend pool.
  # Let its in-test cleanup finish even when a newer commit updates the MR.
  interruptible: false
  tags:
    - gpuworks-l3
  resource_group: gpuworks-ascend-pool
  timeout: 35m
  needs:
    - job: core-ui
      artifacts: true
    - job: core-test
    - job: core-vet
    - job: core-lint
    - job: core-compshare-offline-contracts
  environment:
    name: cloud-test/ascend-primary
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLOUD_FULL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never
  script:
    # The shell runner reuses its checkout between jobs. Keep the mounted test
    # container on the runner UID so evidence files cannot become root-owned
    # and poison the next core checkout.
    - mkdir -p "$CI_PROJECT_DIR/.cache/l4-home/.ssh"
    # Share the persistent host-side Go caches with core-l2/core-l3 instead of
    # re-downloading the full module set inside a fresh container every run.
    - export DOCKER_HOST_CACHE="$HOME/.cache/gpuworks-ci/$CI_PROJECT_ID"
    - mkdir -p "$DOCKER_HOST_CACHE/go-mod" "$DOCKER_HOST_CACHE/go-build"
    # Pass the checkout path explicitly: the shell command is evaluated
    # inside the container, where CI_PROJECT_DIR is otherwise undefined.
    # A folded scalar joins its lines with spaces, so a '#' inside the block is
    # not a YAML comment: it comments out the rest of the assembled shell
    # command. Keep every note about this command above the '- >'.
    #
    # Keep the injected credentials read-only, but leave HOME/.ssh writable:
    # OpenSSH must atomically rewrite known_hosts when StrictHostKeyChecking
    # is enabled by the partition tests, so the container copies them from
    # /run/gpuworks-ssh into a writable $HOME/.ssh on startup. OpenSSH
    # resolves the known_hosts path from the passwd entry, NOT from $HOME:
    # when the runner itself is root (gpu2) uid 0 already exists, no ci-runner
    # user is created, and ssh reads /root/.ssh — so the credentials are also
    # copied to the passwd home of RUNNER_UID after the useradd step
    # (2026-10-03: both pool hosts failed host key verification on gpu2 while
    # the same file passed on gpu3, whose runner uid gets a matching home).
    - >
      docker run --rm --network host
      -e http_proxy="$GPUWORKS_ASCEND_HTTP_PROXY" -e https_proxy="$GPUWORKS_ASCEND_HTTP_PROXY"
      -e HOME="$CI_PROJECT_DIR/.cache/l4-home"
      -e CI_PROJECT_DIR="$CI_PROJECT_DIR"
      -e RUNNER_UID="$(id -u)" -e RUNNER_GID="$(id -g)"
      -v "$GPUWORKS_ASCEND_SSH_DIR:/run/gpuworks-ssh:ro"
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR" -w "$CI_PROJECT_DIR"
      -v "$DOCKER_HOST_CACHE/go-mod:/go-cache/mod"
      -v "$DOCKER_HOST_CACHE/go-build:/go-cache/build"
      -e GOMODCACHE=/go-cache/mod
      -e GOCACHE=/go-cache/build
      -e GOFLAGS=-modcacherw
      -e GOPROXY=https://goproxy.cn,direct -e GOSUMDB=sum.golang.google.cn
      -e GOTOOLCHAIN=local
      -e GPUWORKS_TEST_STRICT=1
      -e "GO_TEST_FLAGS=-coverpkg=./internal/...,./pkg/... -coverprofile=coverage-cloud.out"
      -e GPUWORKS_ASCEND_PRIMARY_HOST="$GPUWORKS_ASCEND_PRIMARY_HOST"
      -e GPUWORKS_ASCEND_HOST="$GPUWORKS_ASCEND_HOST"
      -e GPUWORKS_ASCEND_HOST_2="$GPUWORKS_ASCEND_HOST_2"
      -e GPUWORKS_ASCEND_L4_IMAGE="$GPUWORKS_ASCEND_L4_IMAGE"
      -e GPUWORKS_ASCEND_L4_MODEL="$GPUWORKS_ASCEND_L4_MODEL"
      -e GPUWORKS_ASCEND_L4_CARD="$GPUWORKS_ASCEND_L4_CARD"
      -e GPUWORKS_ASCEND_NERDCTL_L4_IMAGE="$GPUWORKS_ASCEND_NERDCTL_L4_IMAGE"
      -e GPUWORKS_ASCEND_NERDCTL_L4_CARD="$GPUWORKS_ASCEND_NERDCTL_L4_CARD"
      golang:1.26.11@sha256:7af425da11f4fc1a9308eb704369e3f6d1c44e35bac0f874a59ade3f20fdc07e
      sh -c "apt-get update -qq && apt-get install -y -qq openssh-client >/dev/null && cp -a /run/gpuworks-ssh/. \$HOME/.ssh/ && chown -R \$RUNNER_UID:\$RUNNER_GID \$HOME/.ssh && if ! getent passwd \$RUNNER_UID >/dev/null; then getent group \$RUNNER_GID >/dev/null || groupadd --gid \$RUNNER_GID ci-runner; useradd --uid \$RUNNER_UID --gid \$RUNNER_GID --home-dir \$CI_PROJECT_DIR/.cache/l4-home --no-create-home --shell /bin/sh ci-runner; fi && pw_home=\$(getent passwd \$RUNNER_UID | cut -d: -f6) && { [ \"\$pw_home/.ssh\" = \"\$HOME/.ssh\" ] || { mkdir -p \"\$pw_home/.ssh\" && cp -a /run/gpuworks-ssh/. \"\$pw_home/.ssh/\" && chown -R \$RUNNER_UID:\$RUNNER_GID \"\$pw_home/.ssh\"; }; } && setpriv --reuid=\$RUNNER_UID --regid=\$RUNNER_GID --clear-groups -- make test-l4-ascend-pool-partition-inference"
  artifacts:
    when: always
    paths:
      - coverage-cloud.out
    expire_in: 14 days


l4-vast-node-onboarding:
  extends: .l4-acceptance
  timeout: 65m
  environment:
    name: cloud-test/vast/full
    action: prepare
  script:
    - make test-l4-vast-node-onboarding

# The in-process server dials the agent at the public address Vast maps to
# its port.
#
# Kept under cloud-test/vast/* so the VAST_API_KEY scope applies. Sharing
# cloud-test/vast/full while jobs still created deployments made
# l4-vast-node-onboarding fail every night from 2026-10-21 (the later job
# dropped the running one, see the note above .l4-cloud); `action: prepare`
# removes the cause, and the separate name just keeps the jobs distinguishable.
l4-vast-server-dial-node-onboarding:
  extends: .l4-acceptance
  timeout: 65m
  environment:
    name: cloud-test/vast/server-dial
    action: prepare
  script:
    - make test-l4-vast-server-dial-node-onboarding

# A server-dialed agent on a pod, then an edit that renumbers the pod's
# ports: recovery follows the new SSH and agent addresses.
l4-runpod-server-dial-node-onboarding:
  variables:
    GPUWORKS_SSH_PROXY: "socks5://zstack.one:7891"
  extends: .l4-acceptance
  timeout: 65m
  environment:
    name: cloud-test/runpod/server-dial
    action: prepare
  script:
    - make test-l4-runpod-server-dial-node-onboarding

# CompShare VM jobs (everything that allocates a VM; the container job
# l4-compshare-server-dial-node-onboarding-container is not one of them) are
# off the nightly schedules: the pool almost never has capacity for them, and
# the Aliyun spot cases replace them there. They stay runnable on demand from
# a web/api pipeline with COMPSHARE_VM=1, or as an MR manual action. Each job
# still extends this template for its own timeout, resource_group and
# environment.
.l4-compshare-vm:
  extends: .l4-acceptance
  rules:
    - if: '$COMPSHARE_VM == "1" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never

l4-compshare-modelscope-public-download:
  extends: .l4-compshare-vm
  timeout: 30m
  resource_group: gpuworks-cloud-compshare-single-vm-$CI_PIPELINE_IID
  environment:
    # CompShare credentials are environment-scoped to cloud-test/compshare/*.
    name: cloud-test/compshare/download-modelscope
    action: prepare
  script:
    - make test-l4-compshare-modelscope-public-download

# CompShare allows 20 VMs and normal development has at most three concurrent
# pipelines. Use two per-pipeline lanes: a pipeline occupies at most three VMs
# (one single-VM case plus the two-VM case), while three pipelines peak at nine.
# The remaining eleven-VM margin covers cleanup lag and template maintenance.
# Contracts allocate no VM. Every live job still has an immutable run-id and
# exact cleanup; the pipeline IID suffix prevents unrelated pipelines from
# serializing each other.
l4-compshare-single-vm-tp2-dgpu:
  extends: .l4-compshare-vm
  timeout: 180m
  resource_group: gpuworks-cloud-compshare-single-vm-$CI_PIPELINE_IID
  environment:
    name: cloud-test/compshare/suite
    action: prepare
  script:
    - make test-l4-compshare-single-vm-tp2-dgpu

l4-compshare-provisioning-matrix:
