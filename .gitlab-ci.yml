  # the 55m a rented container needs.
  timeout: 95m
  resource_group: gpuworks-cloud-compshare-single-vm-$CI_PIPELINE_IID
  environment:
    name: cloud-test/compshare/server-dial-container
    action: prepare
  script:
    - make test-l4-compshare-server-dial-node-onboarding-container

l4-compshare-one-vm-two-logical-nodes:
