# Aliyun ECS: spot-first VMs with an on-demand fallback, booted from the golden
# image (driver, Docker 29, NVIDIA toolkit, vLLM runner image and test model
# preloaded; see make prepare-aliyun-golden-image). The jobs need these CI
# variables, scoped to cloud-test/aliyun/*:
#   ALIYUN_ACCESS_KEY_ID, ALIYUN_ACCESS_KEY_SECRET  a RAM user limited to ECS and VPC
#   ALIYUN_IMAGE_<REGION>                            golden image ID per region
