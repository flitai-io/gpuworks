# Experimental template for a paired APC benchmark on four ZW810E cards.
# For the A arm, replace --enable-prefix-caching with --no-enable-prefix-caching
# and remove the --mamba-cache-mode align pair. Restart before each arm.
models:
  - model_id: qwen/qwen3-coder-next-zw810e-apc-eval
    source: user
    display_title: Qwen3-Coder-Next APC evaluation
    input_modalities: [text]
    context_length: 16384
    release_date: '2026-01-30'
    model_config:
      model_type: qwen3_next
      num_hidden_layers: 48
      hidden_size: 2048
      num_attention_heads: 16
      num_key_value_heads: 2
      head_dim: 256
      max_position_embeddings: 262144
    kv_bytes_per_token:
      vllm: 98304
    specs:
      - name: bf16-vllm-ppu-zw810e-apc-tp4-16k
        display_name_zh_cn: PPU ZW810E · BF16 · 4 卡 · APC 实验
        display_name_en: PPU ZW810E · BF16 · 4 GPUs · APC evaluation
        scenario: latency
        engine: vllm
        image: gpuworks/gpuworks-runner:hggc13.0-vllm0.23.0-r2
        weights:
          quantization: bf16
          sources:
            - huggingface:
                repo_id: Qwen/Qwen3-Coder-Next
                revision: a7fbcb5c0e12d62a448eaa0e260346bf5dcc0feb
        weight_bytes: 159358031480
        shm_bytes: 8589934592
        gpus:
          vendor: ppu
          name: '^PPU[ _-]?ZW810E$'
        env:
          OMP_NUM_THREADS: '2'
        args:
          - --dtype
          - bfloat16
          - --max-model-len
          - '16384'
          - --max-num-seqs
          - '4'
          - --max-num-batched-tokens
          - '4096'
          - --gpu-memory-utilization
          - '0.55'
          - --enable-prompt-tokens-details
          - --no-async-scheduling
          - --trust-remote-code
          - --skip-mm-profiling
          - --enable-auto-tool-choice
          - --tool-call-parser
          - qwen3_coder
          - --compilation-config
          - '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,3,4]}'
          - --enable-prefix-caching
          - --mamba-cache-mode
          - align
        api:
          health_endpoint: /health
          operations:
            - type: openai.chat
              endpoint: /v1/chat/completions
              mode: stream
        placement:
          language: starlark
          resolver: |
            def resolve(gpu):
                if gpu.count != 4 or gpu.nnodes != 1:
                    return reject("APC evaluation requires exactly 4 ZW810E cards on one node")
                return {"GPU_COUNT": 4, "TP_SIZE": 4, "PP_SIZE": 1, "SP_DEGREE": 1}
